# Three-GPU integration smoke for four-domain dynamic data allocation and
# per-domain OPD loss scaling.
#
# Physical placement:
# - 2 GPUs for the Qwen3-0.6B actor/rollout (FSDP size 2);
# - 1 GPU for the shared Qwen3-8B teacher/ref policy.
#
# This profile validates the controller/sampler/trainer plumbing, not model
# quality. The 1.0 teacher scores are the known reward ceilings and are marked
# calibrated only so the short GPU smoke can execute. Formal experiments must
# use teacher scores measured on the fixed probe sets instead.

runtime:
  python_bin: python
  verl_module: verl.trainer.main_ppo
  wandb_mode: disabled
  wandb_entity: null
  env_file: .env.local
  used_model: no_api

data:
  domain_train_files:
    math:
      - data/G-OPD-Training-Data/DeepMath-103K/train_filtered_level6.parquet
    code:
      - data/G-OPD-Training-Data/Eurus/code_train.parquet
    science:
      - data/G-OPD-Training-Data/Science/train.parquet
    if:
      - data/G-OPD-Training-Data/IF/train.parquet
  domain_sampling_weights:
    math: 1
    code: 1
    science: 1
    if: 1
  domain_sampling_replacement: true
  dataloader_num_workers: 0
  load_parquet_direct: true
  val_files:
    - data/eval_data/math/AIME24/test.parquet
    - data/eval_data/math/AIME25/test.parquet
    - data/eval_data/math/HMMT25Feb/test.parquet
    - data/eval_data/math/HMMT25Nov/test.parquet
    - data/eval_data/code/HumanEvalPlus/test.parquet
    - data/eval_data/code/MBPPPlus/test.parquet
    - data/eval_data/science/GPQA/test.parquet
    - data/eval_data/if/IFBench/test.parquet
  train_batch_size: 16
  val_batch_size: 16
  max_prompt_length: 2048
  max_response_length: 512
  filter_overlong_prompts: true
  truncation: error
  shuffle: false
  validation_shuffle: false
  seed: 42
  return_raw_chat: true
  enable_thinking: false

model:
  student_path: /root/autodl-tmp/models/Qwen3-0.6B
  student_base_path: null
  math_teacher_path: /root/autodl-tmp/models/Qwen3-8B
  code_teacher_path: /root/autodl-tmp/models/Qwen3-8B
  if_teacher_path: /root/autodl-tmp/models/Qwen3-8B
  domain_teacher_paths:
    math: /root/autodl-tmp/models/Qwen3-8B
    code: /root/autodl-tmp/models/Qwen3-8B
    science: /root/autodl-tmp/models/Qwen3-8B
    if: /root/autodl-tmp/models/Qwen3-8B
  teacher_model_device: gpu
  attn_implementation: flash_attention_2

actor:
  learning_rate: "5e-6"
  lr_warmup_steps_ratio: 0.0
  only_reverse_kl_advantages: false
  lambda_vals: 1.0
  multi_teacher_distill: true
  distill_loss_builder: topk_kl
  distill_mode: topk_renormalized_reverse_kl
  topk_distill_enabled: true
  topk_distill_kl_direction: reverse
  topk_distill_k: 32
  topk_distill_support_source: teacher
  topk_distill_tail_bucket: false
  topk_distill_temperature: 1.0
  topk_distill_loss_weight: 1.0
  topk_distill_logprob_chunk_size: 16
  topk_distill_logprob_mode: sparse
  ppo_mini_batch_size: 16
  ppo_micro_batch_size_per_gpu: 1
  ppo_epochs: 1
  use_kl_loss: true
  kl_loss_coef: 0
  kl_loss_type: low_var_kl
  entropy_coeff: 0
  ppo_max_token_len_per_gpu: 4096
  gradient_checkpointing: true
  param_offload: true
  optimizer_offload: true
  fsdp_size: 2
  use_dynamic_bsz: false
  loss_agg_mode: seq-mean-token-mean

rollout:
  calculate_log_probs: true
  log_prob_micro_batch_size_per_gpu: 1
  tensor_model_parallel_size: 1
  name: vllm
  mode: sync
  gpu_memory_utilization: 0.45
  enforce_eager: true
  enable_chunked_prefill: false
  n: 1
  max_num_batched_tokens: 4096
  max_model_len: 2560
  max_num_seqs: 16
  do_sample: false
  temperature: 1.0
  top_p: 1.0
  val_n: 1
  val_do_sample: false
  val_temperature: 0.0
  val_top_p: 1.0
  seed: 42

rollout_correction:
  rollout_is: token
  rollout_is_threshold: 5.0
  rollout_rs: null
  bypass_mode: false

extra_overrides:
  - custom_reward_function.path=mopd_verl/mixed_reward.py
  - custom_reward_function.name=compute_score
  - trainer.resume_mode=disable

worker_placement:
  separate_ref_policy: true
  actor_rollout:
    n_gpus_per_node: 2
    nnodes: 1
  ref_policy:
    n_gpus_per_node: 1
    nnodes: 1

audit:
  enabled: false
  output_dir: audit/mopd-dynamic-budget-qwen0p6b-8b-four-domain-smoke
  domains:
    - math
    - code
    - science
    - if
  dynamic_domain_loss_weighting_enabled: false

domain_budgeting:
  enabled: true
  domains:
    - math
    - code
    - science
    - if
  domain_priors:
    math: 1.0
    code: 1.0
    science: 1.0
    if: 1.0
  teacher_scores:
    math: 1.0
    code: 1.0
    science: 1.0
    if: 1.0
  teacher_scores_calibrated: true
  validation_metric_keys:
    math:
      - val-core/AIME2024/reward/mean@1
      - val-core/AIME2025/reward/mean@1
      - val-core/HMMT25Feb/reward/mean@1
      - val-core/HMMT25Nov/reward/mean@1
    code:
      - val-core/HumanEvalPlus/reward/mean@1
      - val-core/MBPPPlus/reward/mean@1
    science:
      - val-core/m2rl_gpqa_diamond/reward/mean@1
    if:
      - val-core/m2rl_ifbench/reward/mean@1
  validation_reducer: mean
  gap_ema_beta: 0.9
  gap_alpha: 1.0
  gap_epsilon: 1.0e-6
  gap_normalization_floor: 0.05
  max_normalized_gap: 2.0
  exploration_mass: 0.05
  variance_log_ema_beta: 0.9
  variance_epsilon: 1.0e-8
  variance_min_samples: 2
  variance_update_freq_steps: 1
  min_samples_per_domain: 2
  min_sampling_probability: 0.02
  output_dir: logs/domain_budgeting/qwen0p6b_8b_four_domain_smoke

trainer:
  project_name: MOPD
  experiment_name: mopd-dynamic-budget-qwen0p6b-8b-four-domain-4step-smoke
  logger: '["console","tensorboard"]'
  n_gpus_per_node: 2
  nnodes: 1
  save_freq: 2
  test_freq: 1
  total_epochs: 1
  total_training_steps: 4
  default_local_dir: checkpoints/MOPD/mopd-dynamic-budget-qwen0p6b-8b-four-domain-4step-smoke
  critic_warmup: 0
  val_before_train: true
  log_val_generations: 0
  max_actor_ckpt_to_keep: 1
  max_critic_ckpt_to_keep: 1

ray_kwargs:
  ray_init:
    include_dashboard: false
    num_cpus: 16
