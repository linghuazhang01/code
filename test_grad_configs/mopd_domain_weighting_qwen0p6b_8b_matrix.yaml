profile_matrix:
  version: 1
  base:
    runtime:
      python_bin: python
      verl_module: verl.trainer.main_ppo
      wandb_mode: disabled
      env_file: .env.local
      used_model: no_api
    data:
      domain_train_files:
        math:
          - data/G-OPD-Training-Data/DeepMath-103K/train_filtered_level6.parquet
        code:
          - data/G-OPD-Training-Data/Eurus/code_train.parquet
        science:
          - data/G-OPD-Training-Data/Science/train.parquet
      domain_sampling_weights:
        math: 1
        code: 1
        science: 1
      domain_sampling_replacement: true
      load_parquet_direct: true
      val_files:
        - data/eval_data/math/AIME24/test.parquet
        - data/eval_data/code/HumanEvalPlus/test.parquet
        - data/eval_data/science/GPQA/test.parquet
      train_batch_size: 12
      val_batch_size: 12
      max_prompt_length: 2048
      max_response_length: 256
      filter_overlong_prompts: true
      truncation: error
      shuffle: false
      validation_shuffle: false
      seed: 42
      return_raw_chat: true
      enable_thinking: false
    model:
      student_path: /root/autodl-tmp/models/Qwen3-0.6B
      math_teacher_path: /root/autodl-tmp/models/Qwen3-8B
      code_teacher_path: /root/autodl-tmp/models/Qwen3-8B
      domain_teacher_paths:
        math: /root/autodl-tmp/models/Qwen3-8B
        code: /root/autodl-tmp/models/Qwen3-8B
        science: /root/autodl-tmp/models/Qwen3-8B
      teacher_model_device: gpu
      attn_implementation: flash_attention_2
    actor:
      learning_rate: "5e-6"
      lr_warmup_steps_ratio: 0.0
      only_reverse_kl_advantages: false
      lambda_vals: 1.0
      multi_teacher_distill: true
      distill_loss_builder: topk_kl
      distill_mode: topk_renormalized_reverse_kl
      topk_distill_enabled: true
      topk_distill_kl_direction: reverse
      topk_distill_k: 32
      topk_distill_support_source: teacher
      topk_distill_tail_bucket: false
      topk_distill_temperature: 1.0
      topk_distill_loss_weight: 1.0
      topk_distill_logprob_chunk_size: 16
      topk_distill_logprob_mode: sparse
      ppo_mini_batch_size: 12
      ppo_micro_batch_size_per_gpu: 1
      use_kl_loss: true
      kl_loss_coef: 0
      kl_loss_type: low_var_kl
      entropy_coeff: 0
      ppo_max_token_len_per_gpu: 4096
      gradient_checkpointing: true
      param_offload: true
      optimizer_offload: true
      fsdp_size: 2
      use_dynamic_bsz: false
    rollout:
      calculate_log_probs: true
      log_prob_micro_batch_size_per_gpu: 1
      tensor_model_parallel_size: 1
      name: vllm
      mode: sync
      gpu_memory_utilization: 0.45
      enforce_eager: true
      enable_chunked_prefill: false
      n: 1
      max_num_batched_tokens: 4096
      max_model_len: 2304
      max_num_seqs: 12
      do_sample: false
      temperature: 1.0
      top_p: 1.0
      val_n: 1
      val_do_sample: false
      val_temperature: 0.0
      val_top_p: 1.0
      seed: 42
    rollout_correction:
      rollout_is: token
      rollout_is_threshold: 5.0
      bypass_mode: false
    extra_overrides:
      - custom_reward_function.path=mopd_verl/mixed_reward.py
      - custom_reward_function.name=compute_score
      - actor_rollout_ref.actor.ppo_epochs=1
      - trainer.resume_mode=disable
    worker_placement:
      separate_ref_policy: true
      actor_rollout:
        n_gpus_per_node: 2
        nnodes: 1
      ref_policy:
        n_gpus_per_node: 1
        nnodes: 1
    audit:
      enabled: true
      domains: [math, code, science]
      tensorboard_prune_mode: core
      log_sample_level: false
      log_validation_metrics: false
      full_gradient_enabled: false
      token_gap_enabled: false
      entropy_enabled: false
      token_gradient_enabled: false
    trainer:
      project_name: MOPD
      logger: '["console","tensorboard"]'
      n_gpus_per_node: 2
      nnodes: 1
      save_freq: -1
      test_freq: -1
      total_epochs: 1
      critic_warmup: 0
      val_before_train: false
      log_val_generations: 0
    ray_kwargs:
      ray_init:
        include_dashboard: false
        num_cpus: 32
  profiles:
    gradnorm:
      runtime:
        wandb_entity: null
      model:
        student_base_path: null
      rollout_correction:
        rollout_rs: null
      audit:
        output_dir: audit/mopd-weight-signal-gradnorm-qwen0p6b-8b-aw2-fsdpsize2-b12-2step-3gpu-smoke
        full_grad_training_parity_freq_steps: 1
        full_grad_training_parity_rel_l2_threshold: 0.02
        full_gradient_storage_dtype: bfloat16
        dynamic_domain_loss_weighting_enabled: true
        dynamic_domain_loss_weighting_freq_steps: 1
        dynamic_domain_loss_weighting_signal_source: gradient_norm
        dynamic_domain_loss_weighting_ema_beta: 0.0
        dynamic_domain_loss_weighting_weight_ema_beta: 0.0
        dynamic_domain_loss_weighting_alpha: 0.75
        dynamic_domain_loss_weighting_min: 0.3333333333333333
        dynamic_domain_loss_weighting_max: 3.0
        control_token_loss_weighting_enabled: false
        control_token_loss_weight: 1.0
        control_token_ids: []
        all_domain_shared_token_loss_weighting_enabled: false
        all_domain_shared_token_loss_weight: 1.0
        all_domain_shared_token_top_k: 50
      trainer:
        experiment_name: mopd-weight-signal-gradnorm-qwen0p6b-8b-aw2-fsdpsize2-b12-2step-3gpu-smoke
        total_training_steps: 2
        default_local_dir: checkpoints/MOPD/mopd-weight-signal-gradnorm-qwen0p6b-8b-aw2-fsdpsize2-b12-2step-3gpu-smoke
    projection:
      runtime:
