# 2026-10-15 author request: 8-GPU colocated (actor, vLLM rollout and FSDP-8 teacher share all 8 GPUs); teacher batching, fused statistics, compact ids and batched reward on.
# Qwen3-4B math_code / sapd_pos: S9 (position-level budget): Current-Step selection over individual candidate positions, scored by each position's own pre-update Top-32 RKL from an extra student prepass; budget = exactly ceil(p x all valid domain tokens across ranks) positions (Math 5% / Code 1%), >20 per-step occurrence gate (set control_token_online_min_mean_occurrences_per_step: 0.0 to disable).
# Pools (Math Connective 124 / Code Programming 163), gamma=4, per-(micro-batch, domain) mean-one,
# topology, batch and data are inherited unchanged from sapd_8gpu_6s2t.yaml; only the selection
# timing/unit and the run names differ.
extends: sapd_8gpu_6s2t.yaml
runtime:
  wandb_run_id: q4b-mc-sapdpos-8g8c-b528-s42
  slurm_allocation_gpus: 8
audit:
  control_token_online_selection_timing: current_step
  control_token_online_selection_unit: occurrence
  output_dir: audit/q4b-mc-sapdpos-8g8c-b528-s42
paper_eval:
  output_dir: eval_outputs/paper_suite/q4b-mc-sapdpos-8g8c-b528-s42
huggingface_checkpoint:
  path_prefix: checkpoints/qwen4b/math_code/q4b-mc-sapdpos-8g8c-b528-s42
trainer:
  experiment_name: q4b-mc-sapdpos-8g8c-b528-s42
  default_local_dir: checkpoints/MOPD/q4b-mc-sapdpos-8g8c-b528-s42
  n_gpus_per_node: 8
rollout:
  gpu_memory_utilization: 0.4
worker_placement:
  separate_ref_policy: false
  actor_rollout:
    n_gpus_per_node: 8
    nnodes: 1
  ref_policy:
    n_gpus_per_node: null
    nnodes: null
    process_on_nodes: null
extra_overrides:
- custom_reward_function.path=mopd_verl/mixed_reward.py
- custom_reward_function.name=compute_score_batched
- reward_model.reward_manager=batch
- trainer.resume_mode=disable
- actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]
- actor_rollout_ref.ref.fsdp_config.fsdp_size=8
teacher_performance:
  enabled: true
  fused_statistics: true
  compact_topk_ids: true
