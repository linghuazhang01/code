# Qwen3-4B code-only native OPD ("OPD naive") with per-token logging, equal weight, 4 colocated GPUs (actor, vLLM rollout and FSDP-4
# teacher share every GPU), global batch 256. Not launchable by itself: the entropy-selection files
# opd_native_ent_{top20,tail80}_toklog_4gpu_4c_b256.yaml extend it. Base: opd_native_toklog_3gpu_3c.yaml (the
# equal-weight naive run q4b-code-opdnative-toklog-3g3c-b255-s42); this file changes only the topology (3 -> 4 colocated GPUs,
# batch 255 -> 256 by the 4-GPU batch rule).
extends: opd_native_toklog_3gpu_3c.yaml
runtime:
  slurm_allocation_gpus: 4
data:
  train_batch_size: 256
actor:
  ppo_mini_batch_size: 256
worker_placement:
  separate_ref_policy: false
  actor_rollout:
    n_gpus_per_node: 4
    nnodes: 1
trainer:
  n_gpus_per_node: 4
ray_kwargs:
  ray_init:
    num_cpus: 32
# Lists replace the parent's list, so the reference FSDP size is restated here.
extra_overrides:
- custom_reward_function.path=mopd_verl/mixed_reward.py
- custom_reward_function.name=compute_score_batched
- reward_model.reward_manager=batch
- trainer.resume_mode=disable
- actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]
- actor_rollout_ref.ref.fsdp_config.fsdp_size=4
