# Qwen3-4B math / fire_opd on four colocated GPUs: actor, vLLM rollout and the FSDP-4 teacher share every GPU.
# Global batch 256 = 4 GPUs x 64 prompts; one optimizer update per step.
extends: _methods/fire_opd.yaml
runtime:
  slurm_allocation_gpus: 4
  wandb_run_id: q4b-math-fireopd-4g4c-b256-s42
data:
  train_batch_size: 256
actor:
  ppo_mini_batch_size: 256
rollout:
  gpu_memory_utilization: 0.6
worker_placement:
  separate_ref_policy: false
  actor_rollout:
    n_gpus_per_node: 4
    nnodes: 1
  ref_policy:
    n_gpus_per_node: null
    nnodes: null
    process_on_nodes: null
# Lists replace the parent's list, so the reference FSDP size is restated here.
extra_overrides:
- custom_reward_function.path=mopd_verl/mixed_reward.py
- custom_reward_function.name=compute_score_batched
- reward_model.reward_manager=batch
- trainer.resume_mode=disable
- actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]
- actor_rollout_ref.ref.fsdp_config.fsdp_size=4
audit:
  output_dir: audit/q4b-math-fireopd-4g4c-b256-s42
paper_eval:
  output_dir: eval_outputs/paper_suite/q4b-math-fireopd-4g4c-b256-s42
huggingface_checkpoint:
  path_prefix: checkpoints/qwen4b/math/q4b-math-fireopd-4g4c-b256-s42
trainer:
  n_gpus_per_node: 4
  experiment_name: q4b-math-fireopd-4g4c-b256-s42
  default_local_dir: checkpoints/MOPD/q4b-math-fireopd-4g4c-b256-s42
ray_kwargs:
  ray_init:
    num_cpus: 32
