# 2026-10-15 author request: 8-GPU colocated (actor, vLLM rollout and FSDP-8 teacher share all 8 GPUs); teacher batching, fused statistics, compact ids and batched reward on.
# Qwen3-4B math / OPD that learns only v3-pool positions (weight 1); other valid positions weight 0.
extends: _v3pool_fixed_8gpu_6s2t.yaml
runtime:
  wandb_run_id: q4b-math-opdv3only-8g8c-b256-s42
  slurm_allocation_gpus: 8
audit:
  # Per-token logging (user 2026-10-16): same switches as the toklog runs (opd_toklog_* / uniform_top32kl_toklog_*).
  # Logging only, no effect on loss or gradients; the gap/logp/entropy vectors cover every valid response token,
  # including pool positions whose loss weight is 0.
  token_gap_enabled: true
  token_gap_freq_steps: 1
  token_gap_vocab_vector_enabled: true
  token_gap_vocab_vector_freq_steps: 1
  entropy_enabled: true
  entropy_vocab_vector_enabled: true
  entropy_vocab_per_occurrence_mean_vector_enabled: true
  logp_vector_enabled: true
  logp_vector_freq_steps: 1
  logp_abs_vector_enabled: true
  logp_abs_vector_freq_steps: 1
  logp_vocab_per_occurrence_mean_vector_enabled: true
  logp_abs_vocab_per_occurrence_mean_vector_enabled: true
  topk_teacher_student_cross_entropy_vocab_enabled: true
  response_level_enabled: true
  response_level_freq_steps: 1
  response_level_compression: gzip
  log_sample_level: true
  control_token_loss_weight: 1.0
  control_token_other_weight: 0.0
  output_dir: audit/q4b-math-opdv3only-8g8c-b256-s42
paper_eval:
  output_dir: eval_outputs/paper_suite/q4b-math-opdv3only-8g8c-b256-s42
huggingface_checkpoint:
  path_prefix: checkpoints/qwen4b/math/q4b-math-opdv3only-8g8c-b256-s42
trainer:
  experiment_name: q4b-math-opdv3only-8g8c-b256-s42
  default_local_dir: checkpoints/MOPD/q4b-math-opdv3only-8g8c-b256-s42
  n_gpus_per_node: 8
data:
  train_batch_size: 256
actor:
  ppo_mini_batch_size: 256
rollout:
  gpu_memory_utilization: 0.4
worker_placement:
  separate_ref_policy: false
  actor_rollout:
    n_gpus_per_node: 8
    nnodes: 1
  ref_policy:
    n_gpus_per_node: null
    nnodes: null
    process_on_nodes: null
extra_overrides:
- custom_reward_function.path=mopd_verl/mixed_reward.py
- custom_reward_function.name=compute_score_batched
- reward_model.reward_manager=batch
- trainer.resume_mode=disable
- actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]
- actor_rollout_ref.ref.fsdp_config.fsdp_size=8
teacher_performance:
  enabled: true
  fused_statistics: true
  compact_topk_ids: true
