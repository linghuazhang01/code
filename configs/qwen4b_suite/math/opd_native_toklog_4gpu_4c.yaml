# Qwen3-4B math / native OPD (chosen-token policy gradient, G-OPD lambda=1) with per-token logging, four colocated GPUs.
# Paired with opd_toklog_4gpu_4c.yaml: only the objective (the four fields of _methods/opd_native.yaml) and run names differ.
# The audit still records teacher Top-32 cross-entropy and entropy (the trainer computes teacher Top-K for logging),
# but configured_token_loss in the response records is the native policy-gradient loss, not the Top-32 RKL.
extends: opd_toklog_4gpu_4c.yaml
runtime:
  wandb_run_id: q4b-math-opdnative-toklog-4g4c-b256-s42
actor:
  distill_loss_builder: policy_gradient
  distill_mode: chosen_token_policy_gradient
  topk_distill_enabled: false
audit:
  loss_variance_signal: policy_gradient_distillation_signal
  output_dir: audit/q4b-math-opdnative-toklog-4g4c-b256-s42
paper_eval:
  output_dir: eval_outputs/paper_suite/q4b-math-opdnative-toklog-4g4c-b256-s42
huggingface_checkpoint:
  path_prefix: checkpoints/qwen4b/math/q4b-math-opdnative-toklog-4g4c-b256-s42
trainer:
  experiment_name: q4b-math-opdnative-toklog-4g4c-b256-s42
  default_local_dir: checkpoints/MOPD/q4b-math-opdnative-toklog-4g4c-b256-s42
