# Qwen3-4B math / fire_opd on eight GPUs: 6 actor/rollout + 2 dedicated teacher ranks (the paper's Math-Code topology).
# Global batch 258 = 6 actor GPUs x 43 prompts; one optimizer update per step.
extends: _methods/fire_opd.yaml
runtime:
  slurm_allocation_gpus: 8
  wandb_run_id: q4b-math-fireopd-8g6s2t-b258-s42
data:
  train_batch_size: 258
actor:
  ppo_mini_batch_size: 258
rollout:
  gpu_memory_utilization: 0.6
worker_placement:
  separate_ref_policy: true
  actor_rollout:
    n_gpus_per_node: 6
    nnodes: 1
  ref_policy:
    n_gpus_per_node: 2
    nnodes: 1
    process_on_nodes: null
# Lists replace the parent's list, so the reference FSDP size is restated here.
extra_overrides:
- custom_reward_function.path=mopd_verl/mixed_reward.py
- custom_reward_function.name=compute_score
- trainer.resume_mode=disable
- actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]
- actor_rollout_ref.ref.fsdp_config.fsdp_size=2
audit:
  output_dir: audit/q4b-math-fireopd-8g6s2t-b258-s42
paper_eval:
  output_dir: eval_outputs/paper_suite/q4b-math-fireopd-8g6s2t-b258-s42
huggingface_checkpoint:
  path_prefix: checkpoints/qwen4b/math/q4b-math-fireopd-8g6s2t-b258-s42
trainer:
  n_gpus_per_node: 6
  experiment_name: q4b-math-fireopd-8g6s2t-b258-s42
  default_local_dir: checkpoints/MOPD/q4b-math-fireopd-8g6s2t-b258-s42
ray_kwargs:
  ray_init:
    num_cpus: 48
