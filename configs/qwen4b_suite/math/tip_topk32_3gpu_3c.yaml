# Qwen3-4B math / tip_topk32 on three colocated GPUs: actor, vLLM rollout and the FSDP-3 teacher share every GPU.
# Global batch 255 = 3 actor GPUs x 85 prompts; one optimizer update per step.
extends: _methods/tip_topk32.yaml
runtime:
  slurm_allocation_gpus: 3
  wandb_run_id: q4b-math-tiptopk32-3g3c-b255-s42
data:
  train_batch_size: 255
actor:
  ppo_mini_batch_size: 255
rollout:
  gpu_memory_utilization: 0.4
worker_placement:
  separate_ref_policy: false
  actor_rollout:
    n_gpus_per_node: 3
    nnodes: 1
  ref_policy:
    n_gpus_per_node: null
    nnodes: null
    process_on_nodes: null
# Lists replace the parent's list, so the reference FSDP size is restated here.
extra_overrides:
- custom_reward_function.path=mopd_verl/mixed_reward.py
- custom_reward_function.name=compute_score_batched
- reward_model.reward_manager=batch
- trainer.resume_mode=disable
- actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]
- actor_rollout_ref.ref.fsdp_config.fsdp_size=3
audit:
  output_dir: audit/q4b-math-tiptopk32-3g3c-b255-s42
paper_eval:
  output_dir: eval_outputs/paper_suite/q4b-math-tiptopk32-3g3c-b255-s42
huggingface_checkpoint:
  path_prefix: checkpoints/qwen4b/math/q4b-math-tiptopk32-3g3c-b255-s42
trainer:
  n_gpus_per_node: 3
  experiment_name: q4b-math-tiptopk32-3g3c-b255-s42
  default_local_dir: checkpoints/MOPD/q4b-math-tiptopk32-3g3c-b255-s42
ray_kwargs:
  ray_init:
    num_cpus: 24
