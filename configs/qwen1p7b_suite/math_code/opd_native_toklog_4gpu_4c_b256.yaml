# Qwen3-1.7B math_code / native OPD (chosen-token policy gradient, G-OPD lambda=1) with per-token logging on 4 colocated GPUs:
# actor, vLLM rollout and the FSDP-4 teacher share every GPU.
# Global batch 256 = 4 GPUs x 64 prompts; one optimizer update per step.
extends: _methods/opd_native.yaml
runtime:
  slurm_allocation_gpus: 4
  wandb_run_id: q1p7b-mc-opdnative-toklog-4g4c-b256-s42
data:
  train_batch_size: 256
actor:
  ppo_mini_batch_size: 256
rollout:
  gpu_memory_utilization: 0.6
worker_placement:
  separate_ref_policy: false
  actor_rollout:
    n_gpus_per_node: 4
    nnodes: 1
  ref_policy:
    n_gpus_per_node: null
    nnodes: null
    process_on_nodes: null
# Lists replace the parent's list, so the reference FSDP size is restated here.
extra_overrides:
- custom_reward_function.path=mopd_verl/mixed_reward.py
- custom_reward_function.name=compute_score_batched
- reward_model.reward_manager=batch
- trainer.resume_mode=disable
- actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]
- actor_rollout_ref.ref.fsdp_config.fsdp_size=4
audit:
  # Per-token logging (user 2026-10-18): same switches as the toklog runs (opd_toklog_* / opd_native_toklog_*).
  # Logging only: no switch here changes the loss or the gradients.
  token_gap_enabled: true
  token_gap_freq_steps: 1
  token_gap_vocab_vector_enabled: true
  token_gap_vocab_vector_freq_steps: 1
  entropy_enabled: true
  entropy_vocab_vector_enabled: true
  entropy_vocab_per_occurrence_mean_vector_enabled: true
  logp_vector_enabled: true
  logp_vector_freq_steps: 1
  logp_abs_vector_enabled: true
  logp_abs_vector_freq_steps: 1
  logp_vocab_per_occurrence_mean_vector_enabled: true
  logp_abs_vocab_per_occurrence_mean_vector_enabled: true
  topk_teacher_student_cross_entropy_vocab_enabled: true
  response_level_enabled: true
  response_level_freq_steps: 1
  response_level_compression: gzip
  # Per-response sample ID, OPD loss, reward and correctness (loss_variance_sample.jsonl).
  log_sample_level: true
  output_dir: audit/q1p7b-mc-opdnative-toklog-4g4c-b256-s42
paper_eval:
  output_dir: eval_outputs/paper_suite/q1p7b-mc-opdnative-toklog-4g4c-b256-s42
huggingface_checkpoint:
  path_prefix: checkpoints/baselines/math_code/q1p7b-mc-opdnative-toklog-4g4c-b256-s42
trainer:
  n_gpus_per_node: 4
  experiment_name: q1p7b-mc-opdnative-toklog-4g4c-b256-s42
  default_local_dir: checkpoints/MOPD/q1p7b-mc-opdnative-toklog-4g4c-b256-s42
ray_kwargs:
  ray_init:
    num_cpus: 32
