# Qwen3-1.7B math_code / native OPD ("OPD naive": chosen-token policy gradient, G-OPD lambda=1) with fixed v3-pool position
# weights and per-token logging, 8 colocated GPUs, global batch 256. Not launchable by itself:
# opd_native_v3pool_{ignore,only}_toklog_8gpu_8c_b256.yaml set the two weights and the run names.
# Purpose (author 2026-10-20; analysis/token-set-toklog-20261019/README.md section 18): with Top-32 RKL, the pool tokens still
# close their teacher-student gap when their positions get weight 0. Native OPD has no Top-32 support term, so these two runs test
# whether that closing needs it. Equal-weight reference: opd_native_toklog_8gpu_8c_b256.yaml (this file minus the weighting block)
# and the 4-GPU batch-256 run q1p7b-mc-opdnative-toklog-4g4c-b256-s42.
# Pools = the Top-32 v3 ignore/only runs' pools (configs/token_selection/math_code/taxonomy/_mopd_math_code_v3pool_fixed_8gpu_8c.yaml;
# analysis/code-vocab-neighbor-20261014/v3_proposal.md): Math 98 IDs, Code 167 IDs.
# Fixed per-position weights, no online selection, no normalisation: pool positions get control_token_loss_weight, every other
# valid position gets control_token_other_weight. Weight 0 removes the position's gradient (the training gradient mask gates the
# student log-prob, so it applies to the chosen-token policy gradient too); Adam makes the overall gradient scale irrelevant.
extends: opd_native_toklog_8gpu_8c_b256.yaml
audit:
  control_token_loss_weighting_enabled: true
  control_token_online_selection_enabled: false
  control_token_normalize_per_domain: false
  control_token_phase_gate_enabled: false
  control_token_span_weighting_enabled: false
  control_token_speed_weighting_enabled: false
