# Qwen3-1.7B math_code / opd with per-token logging on eight colocated GPUs: actor, vLLM rollout and the FSDP-8 teacher share all 8 GPUs
# (the 1.7B SAPD Math+Code 8g8c topology). vLLM memory 0.75 as in that run.
# Global batch 528 = 8 actor GPUs x 66 prompts; one optimizer update per step.
extends: _methods/opd.yaml
runtime:
  slurm_allocation_gpus: 8
  wandb_run_id: q1p7b-mc-opd-toklog-8g8c-b528-s42
data:
  train_batch_size: 528
actor:
  ppo_mini_batch_size: 528
rollout:
  gpu_memory_utilization: 0.6
worker_placement:
  separate_ref_policy: false
  actor_rollout:
    n_gpus_per_node: 8
    nnodes: 1
  ref_policy:
    n_gpus_per_node: null
    nnodes: null
    process_on_nodes: null
# Lists replace the parent's list, so the reference FSDP size is restated here.
extra_overrides:
- custom_reward_function.path=mopd_verl/mixed_reward.py
- custom_reward_function.name=compute_score_batched
- reward_model.reward_manager=batch
- trainer.resume_mode=disable
- actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]
- actor_rollout_ref.ref.fsdp_config.fsdp_size=8
audit:
  # Per-token logging (user 2026-10-17): same switches as the toklog runs (opd_toklog_* / uniform_top32kl_toklog_*)
  # and the v3-pool configs. Logging only: no switch here changes the loss or the gradients.
  token_gap_enabled: true
  token_gap_freq_steps: 1
  token_gap_vocab_vector_enabled: true
  token_gap_vocab_vector_freq_steps: 1
  entropy_enabled: true
  entropy_vocab_vector_enabled: true
  entropy_vocab_per_occurrence_mean_vector_enabled: true
  logp_vector_enabled: true
  logp_vector_freq_steps: 1
  logp_abs_vector_enabled: true
  logp_abs_vector_freq_steps: 1
  logp_vocab_per_occurrence_mean_vector_enabled: true
  logp_abs_vocab_per_occurrence_mean_vector_enabled: true
  topk_teacher_student_cross_entropy_vocab_enabled: true
  response_level_enabled: true
  response_level_freq_steps: 1
  response_level_compression: gzip
  # Per-response sample ID, OPD loss, reward and correctness (loss_variance_sample.jsonl).
  log_sample_level: true
  output_dir: audit/q1p7b-mc-opd-toklog-8g8c-b528-s42
paper_eval:
  output_dir: eval_outputs/paper_suite/q1p7b-mc-opd-toklog-8g8c-b528-s42
huggingface_checkpoint:
  path_prefix: checkpoints/baselines/math_code/q1p7b-mc-opd-toklog-8g8c-b528-s42
trainer:
  n_gpus_per_node: 8
  experiment_name: q1p7b-mc-opd-toklog-8g8c-b528-s42
  default_local_dir: checkpoints/MOPD/q1p7b-mc-opd-toklog-8g8c-b528-s42
ray_kwargs:
  ray_init:
    num_cpus: 48
