# Method-native TIP objective and selector (arXiv:2604.14084), adapted to the
# project's Qwen3-1.7B student, Qwen3-30B teacher, and three-domain data.

runtime:
  python_bin: python
  verl_module: verl.trainer.main_ppo
  wandb_mode: online
  env_file: .env.local

data:
  domain_train_files:
    math:
      - data/G-OPD-Training-Data/DeepMath-103K/train_filtered_level6.parquet
    code:
      - data/G-OPD-Training-Data/Eurus/code_train.parquet
    science:
      - data/G-OPD-Training-Data/Science/train.parquet
  domain_sampling_weights:
    math: 1
    code: 1
    science: 1
  domain_sampling_replacement: true
  val_files:
    - data/eval_data/math/AIME24/test.parquet
    - data/eval_data/math/AIME25/test.parquet
    - data/eval_data/math/HMMT25Feb/test.parquet
    - data/eval_data/math/HMMT25Nov/test.parquet
    - data/eval_data/code/HumanEvalPlus/test.parquet
    - data/eval_data/code/MBPPPlus/test.parquet
    - data/eval_data/science/GPQA/test.parquet
  load_parquet_direct: true
  train_batch_size: 24
  val_batch_size: 128
  max_prompt_length: 2048
  max_response_length: 8192
  filter_overlong_prompts: true
  truncation: error
  shuffle: true
  validation_shuffle: false
  seed: 42
  return_raw_chat: true
  enable_thinking: false

model:
  student_path: ../models/Qwen3-1.7B
  student_base_path: null
  primary_teacher_path: ../models/Qwen3-30B-A3B-Instruct-2507
  math_teacher_path: ../models/Qwen3-30B-A3B-Instruct-2507
  code_teacher_path: ../models/Qwen3-30B-A3B-Instruct-2507
  domain_teacher_paths:
    math: ../models/Qwen3-30B-A3B-Instruct-2507
    code: ../models/Qwen3-30B-A3B-Instruct-2507
    science: ../models/Qwen3-30B-A3B-Instruct-2507
  teacher_model_device: cpu
  attn_implementation: flash_attention_2
  use_remove_padding: false

actor:
  learning_rate: "5e-6"
  lr_scheduler_type: cosine
  lr_warmup_steps_ratio: 0.0
  only_reverse_kl_advantages: false
  lambda_vals: 1.0
  multi_teacher_distill: false
  distill_loss_builder: tip_full_vocab
  distill_mode: chosen_token_reverse_kl
  token_baseline_method: none
  tip_native_retention_ratio: 0.5
  tip_native_entropy_clip_quantile: 0.98
  tip_native_chunk_size: 512
  tip_native_temperature: 1.0
  topk_distill_enabled: false
  ppo_mini_batch_size: 24
  ppo_micro_batch_size_per_gpu: 1
  ppo_epochs: 1
  use_dynamic_bsz: false
  use_kl_loss: false
  kl_loss_coef: 0
  entropy_coeff: 0
  ppo_max_token_len_per_gpu: 10240
  gradient_checkpointing: true
  param_offload: true
  optimizer_offload: true
  loss_agg_mode: seq-mean-token-mean

rollout:
  calculate_log_probs: false
  log_prob_micro_batch_size_per_gpu: 1
  tensor_model_parallel_size: 2
  name: vllm
  mode: sync
  gpu_memory_utilization: 0.6
  enforce_eager: true
  enable_chunked_prefill: false
  n: 1
  max_num_batched_tokens: 10240
  max_model_len: 10240
  max_num_seqs: 16
  do_sample: true
  temperature: 1.0
  top_p: 1.0
  val_n: 1
  val_do_sample: false
  val_temperature: 0.0
  val_top_p: 1.0
  seed: 42

rollout_correction:
  rollout_is: null
  rollout_rs: null
  bypass_mode: false

worker_placement:
  separate_ref_policy: false
  actor_rollout:
    n_gpus_per_node: 8
    nnodes: 1

audit:
  enabled: false
  domains:
    - math
    - code
    - science

domain_budgeting:
  enabled: false

paper_eval:
  enabled: false

trainer:
  project_name: MOPD
  experiment_name: tip-native-full-vocab-rho50-qwen3-30b-to-1p7b
  logger: '["console","tensorboard","wandb"]'
  n_gpus_per_node: 8
  nnodes: 1
  save_freq: 10
  default_local_dir: checkpoints/MOPD/tip-native-full-vocab-rho50-qwen3-30b-to-1p7b
  test_freq: -1
  total_epochs: 3
  total_training_steps: 200
  critic_warmup: 0
  val_before_train: false
  log_val_generations: 10
  max_actor_ckpt_to_keep: 2

ray_kwargs:
  ray_init:
    include_dashboard: false
    num_cpus: 24
