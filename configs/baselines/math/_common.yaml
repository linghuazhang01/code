# Shared Math-only baseline budget for Qwen3-1.7B student distillation from
# Qwen3-30B-A3B-Instruct-2507. User-facing configs in this directory extend a
# method fragment, then set one 4-8 GPU resource profile.

runtime:
  python_bin: /home/shuang_qiu/env/miniconda3/envs/mopd-verl/bin/python
  verl_module: verl.trainer.main_ppo
  wandb_mode: online
  wandb_entity: lz101-rice-university
  env_file: .env.local
  used_model: no_api
  wandb_resume: never
  cuda_visible_devices: null

data:
  domain_train_files:
    math:
      - ../mopd/code/data/G-OPD-Training-Data/DeepMath-103K/train_filtered_level6.parquet
  domain_sampling_weights:
    math: 1
  domain_sampling_replacement: true
  load_parquet_direct: true
  val_files:
    - ../mopd/code/data/eval_data/math/AIME24/test.parquet
    - ../mopd/code/data/eval_data/math/AIME25/test.parquet
    - ../mopd/code/data/eval_data/math/HMMT25Feb/test.parquet
    - ../mopd/code/data/eval_data/math/HMMT25Nov/test.parquet
  # The user-facing profile always overrides this with its nearest
  # actor-world-size-divisible value to global batch 256.
  train_batch_size: 255
  val_batch_size: 1024
  max_prompt_length: 2048
  max_response_length: 16384
  filter_overlong_prompts: true
  truncation: error
  shuffle: true
  validation_shuffle: false
  seed: 42
  return_raw_chat: true
  enable_thinking: false

model:
  student_path: ../mopd/models/Qwen3-1.7B
  student_base_path: null
  math_teacher_path: ../mopd/models/Qwen3-30B-A3B-Instruct-2507
  domain_teacher_paths:
    math: ../mopd/models/Qwen3-30B-A3B-Instruct-2507
  teacher_model_device: gpu
  attn_implementation: flash_attention_2

actor:
  learning_rate: "5e-6"
  lr_warmup_steps_ratio: 0.0
  only_reverse_kl_advantages: false
  lambda_vals: 1.0
  multi_teacher_distill: false
  distill_loss_builder: policy_gradient
  distill_mode: chosen_token_policy_gradient
  token_baseline_method: none
  token_baseline_retention_ratio: 0.5
  token_baseline_selection_mode: topk
  fire_opd_teacher_confidence_alpha: 1.0
  fire_opd_student_confusion_beta: 1.0
  fire_opd_trajectory_drop_ratio: 0.2
  fire_opd_filter_trajectories: false
  topk_distill_enabled: false
  topk_distill_kl_direction: reverse
  topk_distill_k: 32
  topk_distill_support_source: teacher
  topk_distill_tail_bucket: false
  topk_distill_temperature: 1.0
  topk_distill_loss_weight: 1.0
  topk_distill_logprob_chunk_size: 16
  topk_distill_logprob_mode: sparse
  teacher_prefix_enabled: false
  ppo_mini_batch_size: 255
  ppo_micro_batch_size_per_gpu: 1
  ppo_epochs: 1
  use_dynamic_bsz: false
  use_kl_loss: true
  kl_loss_coef: 0
  kl_loss_type: low_var_kl
  entropy_coeff: 0
  ppo_max_token_len_per_gpu: 32768
  gradient_checkpointing: true
  param_offload: true
  optimizer_offload: true
  fsdp_size: 1
  loss_agg_mode: token-mean

rollout:
  calculate_log_probs: true
  log_prob_micro_batch_size_per_gpu: 1
  # TP=1 permits odd actor pool sizes in the 4/6/8-GPU allocations.
  tensor_model_parallel_size: 1
  name: vllm
  mode: sync
  gpu_memory_utilization: 0.6
  enforce_eager: true
  enable_chunked_prefill: false
  n: 1
  max_num_batched_tokens: 32768
  max_model_len: 18432
  max_num_seqs: 24
  do_sample: true
  temperature: 1.0
  top_p: 1.0
  val_n: 1
  val_do_sample: false
  val_temperature: 0.0
  val_top_p: 1.0
  seed: 42

rollout_correction:
  rollout_is: token
  rollout_is_threshold: 5.0
  rollout_rs: null
  bypass_mode: false

extra_overrides:
  - custom_reward_function.path=mopd_verl/mixed_reward.py
  - custom_reward_function.name=compute_score
  - trainer.resume_mode=disable

worker_placement:
  separate_ref_policy: true
  actor_rollout:
    n_gpus_per_node: 3
    nnodes: 1
  ref_policy:
    n_gpus_per_node: 1
    nnodes: 1

audit:
  enabled: true
  output_dir: audit/qwen1p7b-30b-math-opd-4gpu-b255
  domains:
    - math
  tensorboard_prefix: mopd
  tensorboard_layout: domain_category
  tensorboard_prune_mode: core
  loss_variance_signal: policy_gradient_distillation_signal
  log_sample_level: false
  response_level_enabled: false
  log_validation_metrics: false
  full_gradient_enabled: false
  sample_gradient_enabled: false
  token_gap_enabled: false
  entropy_enabled: false
  token_gradient_enabled: false

domain_budgeting:
  enabled: false

paper_eval:
  enabled: false
  output_dir: eval_outputs/paper_suite/qwen1p7b-30b-math-opd-4gpu-b255
  datasets:
    - aime24
    - aime25
    - hmmt25_feb
    - hmmt25_nov

huggingface_checkpoint:
  enabled: true
  steps: [50, 55, 60, 65, 70]
  repo_id: icemoon28/opd-checkpoints
  private: true
  token_env_var: HF_TOKEN

trainer:
  project_name: MOPD
  experiment_name: qwen1p7b-30b-math-opd-4gpu-b255
  seed: 42
  logger: '["console","tensorboard","wandb"]'
  n_gpus_per_node: 3
  nnodes: 1
  save_freq: 5
  test_freq: -1
  total_epochs: 3
  total_training_steps: 200
  default_local_dir: checkpoints/MOPD/qwen1p7b-30b-math-opd-4gpu-b255
  critic_warmup: 0
  val_before_train: false
  log_val_generations: 10
  max_actor_ckpt_to_keep: 2
  max_critic_ckpt_to_keep: 1

ray_kwargs:
  ray_init:
    include_dashboard: false
    num_cpus: 24
