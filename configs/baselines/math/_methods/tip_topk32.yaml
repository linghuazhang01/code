# Scalable TIP baseline: TIP Soft-OR token selection with teacher Top-32
# renormalized reverse-KL disagreement and training objective.
extends: ../_common.yaml

actor:
  distill_loss_builder: topk_kl
  distill_mode: topk_renormalized_reverse_kl
  token_baseline_method: tip_topk32
  token_baseline_retention_ratio: 0.5
  token_baseline_selection_mode: topk
  topk_distill_enabled: true
  topk_distill_kl_direction: reverse
  topk_distill_k: 32
  topk_distill_support_source: teacher
  topk_distill_tail_bucket: false
  topk_distill_temperature: 1.0
  topk_distill_loss_weight: 1.0
  loss_agg_mode: seq-mean-token-mean

audit:
  loss_variance_signal: topk_renormalized_reverse_kl+tip_topk32_token_weighting
