# Canonical OPD baseline matrix.
#
# Usage:
#   python -m mopd_verl.launch \
#     --config configs/baselines/opd_baselines.yaml::tip_topk32_rho50
#
# The TopK32 profiles hold the distillation objective fixed and change only
# the token scoring/weighting rule. Native objective profiles are provided for
# OPD, ExOPD, EOPD, and FiRe-OPD.

profile_matrix:
  version: 1
  base:
    runtime:
      python_bin: python
      verl_module: verl.trainer.main_ppo
      wandb_mode: online
      wandb_entity: lz101-rice-university
      env_file: .env.local
      used_model: no_api

    data:
      domain_train_files:
        math:
          - data/G-OPD-Training-Data/DeepMath-103K/train_filtered_level6.parquet
        code:
          - data/G-OPD-Training-Data/Eurus/code_train.parquet
        science:
          - data/G-OPD-Training-Data/Science/train.parquet
      domain_sampling_weights:
        math: 1
        code: 1
        science: 1
      domain_sampling_replacement: true
      load_parquet_direct: true
      val_files:
        - data/eval_data/math/AIME24/test.parquet
        - data/eval_data/math/AIME25/test.parquet
        - data/eval_data/math/HMMT25Feb/test.parquet
        - data/eval_data/math/HMMT25Nov/test.parquet
        - data/eval_data/code/HumanEvalPlus/test.parquet
        - data/eval_data/code/MBPPPlus/test.parquet
        - data/eval_data/science/GPQA/test.parquet
      train_batch_size: 504
      val_batch_size: 1024
      max_prompt_length: 2048
      max_response_length: 16384
      filter_overlong_prompts: true
      truncation: error
      shuffle: true
      validation_shuffle: false
      seed: 42
      return_raw_chat: true
      enable_thinking: false

    model:
      student_path: ../models/Qwen3-4B
      student_base_path: null
      math_teacher_path: ../models/Qwen3-30B-A3B-Instruct-2507
      code_teacher_path: ../models/Qwen3-30B-A3B-Instruct-2507
      domain_teacher_paths:
        math: ../models/Qwen3-30B-A3B-Instruct-2507
        code: ../models/Qwen3-30B-A3B-Instruct-2507
        science: ../models/Qwen3-30B-A3B-Instruct-2507
      teacher_model_device: gpu
      attn_implementation: flash_attention_2

    actor:
      learning_rate: "5e-6"
      lr_warmup_steps_ratio: 0.0
      only_reverse_kl_advantages: false
      lambda_vals: 1.0
      multi_teacher_distill: true
      distill_loss_builder: topk_kl
      distill_mode: topk_renormalized_reverse_kl
      token_baseline_method: none
      token_baseline_retention_ratio: 0.5
      token_baseline_selection_mode: topk
      fire_opd_teacher_confidence_alpha: 1.0
      fire_opd_student_confusion_beta: 1.0
      fire_opd_trajectory_drop_ratio: 0.2
      fire_opd_filter_trajectories: false
      topk_distill_enabled: true
      topk_distill_kl_direction: reverse
      topk_distill_k: 32
      topk_distill_support_source: teacher
      topk_distill_tail_bucket: false
      topk_distill_temperature: 1.0
      topk_distill_loss_weight: 1.0
      topk_distill_logprob_chunk_size: 16
      topk_distill_logprob_mode: sparse
      teacher_prefix_enabled: false
      ppo_mini_batch_size: 504
      ppo_micro_batch_size_per_gpu: 1
      ppo_epochs: 1
      use_dynamic_bsz: false
      use_kl_loss: true
      kl_loss_coef: 0
      kl_loss_type: low_var_kl
      entropy_coeff: 0
      ppo_max_token_len_per_gpu: 32768
      gradient_checkpointing: true
      param_offload: true
      optimizer_offload: true
      fsdp_size: 1
      loss_agg_mode: token-mean

    rollout:
      calculate_log_probs: true
      log_prob_micro_batch_size_per_gpu: 1
      tensor_model_parallel_size: 2
      name: vllm
      mode: sync
      gpu_memory_utilization: 0.6
      enforce_eager: true
      enable_chunked_prefill: false
      n: 1
      max_num_batched_tokens: 32768
      max_model_len: 18432
      max_num_seqs: 24
      do_sample: true
      temperature: 1.0
      top_p: 1.0
      val_n: 1
      val_do_sample: false
      val_temperature: 0.0
      val_top_p: 1.0
      seed: 42

    rollout_correction:
      rollout_is: token
      rollout_is_threshold: 5.0
      rollout_rs: null
      bypass_mode: false

    extra_overrides:
      - custom_reward_function.path=mopd_verl/mixed_reward.py
      - custom_reward_function.name=compute_score

    worker_placement:
      separate_ref_policy: true
      actor_rollout:
        n_gpus_per_node: 6
        nnodes: 1
      ref_policy:
        n_gpus_per_node: 2
        nnodes: 1

    audit:
      enabled: false
      domains:
        - math
        - code
        - science

    domain_budgeting:
      enabled: false

    paper_eval:
      enabled: false
      datasets:
        - aime24
        - aime25
        - hmmt25_feb
        - hmmt25_nov
        - humaneval_plus
        - mbpp_plus
        - lcb

    trainer:
      project_name: MOPD
      logger: '["console","tensorboard","wandb"]'
      n_gpus_per_node: 6
      nnodes: 1
      save_freq: 5
      test_freq: -1
      total_epochs: 3
      total_training_steps: 200
      critic_warmup: 0
      val_before_train: false
      log_val_generations: 10
      max_actor_ckpt_to_keep: 2
      max_critic_ckpt_to_keep: 1

    ray_kwargs:
      ray_init:
        include_dashboard: false
        num_cpus: 24

  profiles:
    topk32_uniform:
      trainer:
        experiment_name: baseline-topk32-uniform
        default_local_dir: checkpoints/MOPD/baseline-topk32-uniform

    entropy_topk32_rho50:
      actor:
        token_baseline_method: entropy
        token_baseline_retention_ratio: 0.5
        token_baseline_selection_mode: topk
      trainer:
        experiment_name: baseline-entropy-topk32-rho50
        default_local_dir: checkpoints/MOPD/baseline-entropy-topk32-rho50

    entropy_sample_topk32_rho50:
      actor:
        token_baseline_method: entropy
        token_baseline_retention_ratio: 0.5
        token_baseline_selection_mode: sample
      trainer:
        experiment_name: baseline-entropy-sample-topk32-rho50
        default_local_dir: checkpoints/MOPD/baseline-entropy-sample-topk32-rho50

    tip_topk32_rho50:
      actor:
        token_baseline_method: tip_topk32
        token_baseline_retention_ratio: 0.5
        token_baseline_selection_mode: topk
      trainer:
        experiment_name: baseline-tip-topk32-rho50
        default_local_dir: checkpoints/MOPD/baseline-tip-topk32-rho50

    fire_token_topk32:
      actor:
        token_baseline_method: fire_opd
        fire_opd_filter_trajectories: false
      trainer:
        experiment_name: baseline-fire-token-topk32
        default_local_dir: checkpoints/MOPD/baseline-fire-token-topk32

    opd_native:
      actor:
        distill_loss_builder: policy_gradient
        distill_mode: chosen_token_policy_gradient
        topk_distill_enabled: false
      trainer:
        experiment_name: baseline-opd-native
        default_local_dir: checkpoints/MOPD/baseline-opd-native

    exopd_native_lambda1p25:
      model:
        student_base_path: ../models/Qwen3-4B
      actor:
        only_reverse_kl_advantages: true
        lambda_vals: 1.25
        distill_loss_builder: exopd
        distill_mode: chosen_token_policy_gradient
        topk_distill_enabled: false
      trainer:
        experiment_name: baseline-exopd-native-lambda1p25
        default_local_dir: checkpoints/MOPD/baseline-exopd-native-lambda1p25

    eopd_native:
      actor:
        distill_loss_builder: eopd
        distill_mode: chosen_token_policy_gradient
        topk_distill_enabled: false
        eopd_entropy_threshold: 0.8
        eopd_forward_kl_weight: 1.0
        eopd_topk_k: 16
      trainer:
        experiment_name: baseline-eopd-native-tau0p8-alpha1-k16
        default_local_dir: checkpoints/MOPD/baseline-eopd-native-tau0p8-alpha1-k16

    fire_opd_native:
      actor:
        distill_loss_builder: policy_gradient
        distill_mode: chosen_token_policy_gradient
        token_baseline_method: fire_opd
        fire_opd_teacher_confidence_alpha: 1.0
        fire_opd_student_confusion_beta: 1.0
        fire_opd_trajectory_drop_ratio: 0.2
        fire_opd_filter_trajectories: true
        topk_distill_enabled: false
      trainer:
        experiment_name: baseline-fire-opd-native
        default_local_dir: checkpoints/MOPD/baseline-fire-opd-native
