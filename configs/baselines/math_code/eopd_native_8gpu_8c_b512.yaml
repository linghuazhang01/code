# 2026-10-15 author request: 8-GPU colocated (actor, vLLM rollout and FSDP-8 teacher share all 8 GPUs); teacher batching, fused statistics, compact ids and batched reward on.
# Method semantics follow ../opd_baselines.yaml; see README.md for topology.
extends: _common.yaml
runtime:
  slurm_allocation_gpus: 8
actor:
  distill_loss_builder: eopd
  distill_mode: chosen_token_policy_gradient
  topk_distill_enabled: false
  eopd_entropy_threshold: 0.8
  eopd_forward_kl_weight: 1.0
  eopd_topk_k: 16
  ppo_mini_batch_size: 512
rollout_correction:
  rollout_is: null
worker_placement:
  separate_ref_policy: false
  actor_rollout:
    n_gpus_per_node: 8
    nnodes: 1
  ref_policy:
    n_gpus_per_node: null
    nnodes: null
    process_on_nodes: null
extra_overrides:
- custom_reward_function.path=mopd_verl/mixed_reward.py
- custom_reward_function.name=compute_score_batched
- reward_model.reward_manager=batch
- trainer.resume_mode=disable
- actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]
- actor_rollout_ref.ref.fsdp_config.fsdp_size=8
teacher_performance:
  enabled: true
  topk_logprob_chunk_size: 1024
  max_micro_batch_size: 32
  max_tokens: 57344
  moe_dispatch: stable_sort
  memory_margin_gib: 12.0
  fused_statistics: true
  compact_topk_ids: true
audit:
  output_dir: audit/qwen1p7b-30b-math-code-eopd-native-8gpu-8c-b512-s42
  loss_variance_signal: policy_gradient+entropy_gated_topk_forward_kl
paper_eval:
  output_dir: eval_outputs/paper_suite/qwen1p7b-30b-math-code-eopd-native-8gpu-8c-b512-s42
trainer:
  n_gpus_per_node: 8
  experiment_name: qwen1p7b-30b-math-code-eopd-native-8gpu-8c-b512-s42
  default_local_dir: checkpoints/MOPD/qwen1p7b-30b-math-code-eopd-native-8gpu-8c-b512-s42
ray_kwargs:
  ray_init:
    num_cpus: 48
data:
  train_batch_size: 512
rollout:
  gpu_memory_utilization: 0.6
