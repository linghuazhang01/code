# OPD native chosen-token objective.
# Qwen3-1.7B student distilled from Qwen3-30B-A3B-Instruct-2507.
# Topology: four actor/student workers with the FSDP teacher co-located on the
# same four workers; global batch 528 (= 4 * 132, the nearest divisible batch
# to the existing 525-sample profile).
extends: qwen1p7b_30b_eopd_native_4gpu_b525.yaml

runtime:
  slurm_allocation_gpus: 4
  wandb_run_id: qwen1p7b-30b-opd-native-4gpu-b528-colocated
  wandb_resume: never

data:
  train_batch_size: 528

actor:
  distill_loss_builder: policy_gradient
  distill_mode: chosen_token_policy_gradient
  token_baseline_method: none
  fire_opd_filter_trajectories: false
  ppo_mini_batch_size: 528

worker_placement:
  separate_ref_policy: false
  actor_rollout: {n_gpus_per_node: 4, nnodes: 1}
  # No independent ref pool: the teacher is initialized by the same workers.
  ref_policy: {n_gpus_per_node: null, nnodes: null, process_on_nodes: null}

extra_overrides:
  - custom_reward_function.path=mopd_verl/mixed_reward.py
  - custom_reward_function.name=compute_score
  - trainer.resume_mode=disable
  - actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]
  - actor_rollout_ref.ref.fsdp_config.fsdp_size=4

teacher_performance:
  # The optimized wrapper targets a dedicated single-rank ref worker. Use the
  # stock path for the four-rank co-located teacher.
  enabled: false

trainer:
  experiment_name: qwen1p7b-30b-opd-native-4gpu-b528-colocated
  n_gpus_per_node: 4
  default_local_dir: checkpoints/MOPD/qwen1p7b-30b-opd-native-4gpu-b528-colocated
