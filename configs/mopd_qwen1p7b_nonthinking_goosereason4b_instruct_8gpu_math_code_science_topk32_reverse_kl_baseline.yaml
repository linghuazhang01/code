# Pure Top-32 reverse-KL baseline for distilling
# NVIDIA Nemotron-Research-GooseReason-4B-Instruct into Qwen3-1.7B.
#
# Qwen3-1.7B is the post-trained/SFT checkpoint, not Qwen3-1.7B-Base.
# Setting enable_thinking=false runs the student in non-thinking mode while
# preserving tokenizer/EOS compatibility with the GooseReason teacher.
#
# Baseline contract:
# - sample one on-policy response per prompt from the student;
# - minimize reverse KL on the teacher-selected Top-32 support, renormalized
#   inside that support, with no tail bucket;
# - use fixed, balanced math/code/science sampling;
# - disable MOPD/TLPD reweighting, domain budgeting, token weighting, gradient
#   audit, and paper evaluation.
#
# The actor/rollout and ref/teacher are colocated on one eight-GPU Ray pool.
# Run a one-step smoke test before launching the full 200-step experiment.

runtime:
  python_bin: python
  verl_module: verl.trainer.main_ppo
  wandb_mode: online
  wandb_entity: null
  env_file: .env.local
  used_model: no_api

data:
  domain_train_files:
    math:
      - data/G-OPD-Training-Data/DeepMath-103K/train_filtered_level6.parquet
    code:
      - data/G-OPD-Training-Data/Eurus/code_train.parquet
    science:
      - data/G-OPD-Training-Data/Science/train.parquet
  domain_sampling_weights:
    math: 1
    code: 1
    science: 1
  domain_sampling_replacement: true
  load_parquet_direct: true
  val_files:
    - data/eval_data/math/AIME24/test.parquet
    - data/eval_data/math/AIME25/test.parquet
    - data/eval_data/math/HMMT25Feb/test.parquet
    - data/eval_data/math/HMMT25Nov/test.parquet
    - data/eval_data/code/HumanEvalPlus/test.parquet
    - data/eval_data/code/MBPPPlus/test.parquet
    - data/eval_data/science/GPQA/test.parquet
  # 504 = 8 GPUs x 3 domains x 21 samples.
  train_batch_size: 504
  max_prompt_length: 2048
  max_response_length: 16384
  val_batch_size: 1024
  filter_overlong_prompts: true
  truncation: error
  shuffle: true
  validation_shuffle: false
  seed: 42
  return_raw_chat: true
  enable_thinking: false

model:
  student_path: ../models/Qwen3-1.7B
  student_base_path: null
  math_teacher_path: ../models/Nemotron-Research-GooseReason-4B-Instruct
  code_teacher_path: ../models/Nemotron-Research-GooseReason-4B-Instruct
  domain_teacher_paths:
    math: ../models/Nemotron-Research-GooseReason-4B-Instruct
    code: ../models/Nemotron-Research-GooseReason-4B-Instruct
    science: ../models/Nemotron-Research-GooseReason-4B-Instruct
  teacher_model_device: gpu
  attn_implementation: flash_attention_2

actor:
  learning_rate: "5e-6"
  lr_warmup_steps_ratio: 0.0
  # Top-k KL is a direct loss builder, so the chosen-token advantage path is off.
  only_reverse_kl_advantages: false
  lambda_vals: 1.0
  multi_teacher_distill: true
  distill_loss_builder: topk_kl
  distill_mode: topk_renormalized_reverse_kl
  topk_distill_enabled: true
  topk_distill_kl_direction: reverse
  topk_distill_k: 32
  topk_distill_support_source: teacher
  topk_distill_tail_bucket: false
  topk_distill_temperature: 1.0
  topk_distill_loss_weight: 1.0
  topk_distill_logprob_chunk_size: 16
  topk_distill_logprob_mode: sparse
  teacher_prefix_enabled: false
  ppo_mini_batch_size: 504
  ppo_micro_batch_size_per_gpu: 1
  use_kl_loss: true
  kl_loss_coef: 0
  kl_loss_type: low_var_kl
  entropy_coeff: 0
  ppo_max_token_len_per_gpu: 32768
  gradient_checkpointing: true
  param_offload: true
  optimizer_offload: true
  fsdp_size: 1
  use_dynamic_bsz: false

rollout:
  calculate_log_probs: true
  log_prob_micro_batch_size_per_gpu: 1
  tensor_model_parallel_size: 2
  name: vllm
  mode: sync
  gpu_memory_utilization: 0.6
  enforce_eager: true
  enable_chunked_prefill: false
  n: 1
  max_num_batched_tokens: 32768
  max_model_len: 18432
  max_num_seqs: 24
  do_sample: true
  temperature: 1.0
  top_p: 1.0
  val_n: 1
  val_do_sample: false
  val_temperature: 0.0
  val_top_p: 1.0
  seed: 42

# No token-wise importance weighting: keep the objective as pure Top-32 KL.
rollout_correction:
  rollout_is: "null"
  rollout_is_threshold: 5.0
  rollout_rs: null
  bypass_mode: false

extra_overrides:
  - custom_reward_function.path=mopd_verl/mixed_reward.py
  - custom_reward_function.name=compute_score
  # A baseline run must start from the configured SFT checkpoint unless the
  # caller explicitly overrides this setting and supplies a resume path.
  - trainer.resume_mode=disable

worker_placement:
  separate_ref_policy: false
  actor_rollout:
    n_gpus_per_node: 8
    nnodes: 1

# Explicitly keep every MOPD/TLPD analysis or reweighting path out of training.
audit:
  enabled: false
  domains:
    - math
    - code
    - science
  log_sample_level: false
  log_validation_metrics: false
  full_gradient_enabled: false
  full_gradient_direct_recompute_enabled: false
  sequence_masked_target_enabled: false
  sequence_masked_target_use_as_primary: false
  sequence_replay_skip_non_target_domains: false
  sample_gradient_enabled: false
  sample_gradient_norm_enabled: false
  sample_gradient_cos_enabled: false
  sample_gradient_backward_recompute_enabled: false
  sample_gradient_backward_sync_enabled: false
  sample_gradient_log_sample_level: false
  token_gap_enabled: false
  token_gap_vocab_vector_enabled: false
  vocab_per_occurrence_mean_vector_enabled: false
  logp_vocab_per_occurrence_mean_vector_enabled: false
  logp_abs_vocab_per_occurrence_mean_vector_enabled: false
  entropy_vocab_per_occurrence_mean_vector_enabled: false
  entropy_enabled: false
  entropy_vocab_vector_enabled: false
  topk_teacher_student_cross_entropy_vocab_enabled: false
  logp_vector_enabled: false
  logp_abs_vector_enabled: false
  token_gradient_enabled: false
  token_gradient_tail_enabled: false
  token_gradient_gap_selection_enabled: false
  token_gradient_gap_abs_selection_enabled: false
  token_gradient_loss_abs_selection_enabled: false
  token_gradient_top_k: null
  token_gradient_top_p_enabled: false
  token_gradient_log_tokens_jsonl_enabled: false
  token_gradient_backward_recompute_enabled: false
  token_gradient_backward_sync_enabled: false
  dynamic_domain_loss_weighting_enabled: false
  control_token_loss_weighting_enabled: false
  all_domain_shared_token_loss_weighting_enabled: false
  gradient_fingerprint_enabled: false

domain_budgeting:
  enabled: false

paper_eval:
  enabled: false
  script_path: eval/scripts/run_paper_eval_suite.sh
  model_path: null
  output_dir: eval_outputs/paper_suite/qwen1p7b_nonthinking_goosereason4b_instruct_math_code_science_topk32_reverse_kl_baseline
  datasets:
    - aime24
    - aime25
    - hmmt25_feb
    - hmmt25_nov
    - humaneval_plus
    - mbpp_plus
    - lcb
  run_on_initial_validation: true
  evaluate_current_checkpoint: true
  fail_on_error: false
  timeout_seconds: 0

trainer:
  project_name: MOPD
  experiment_name: qwen1p7b-nonthinking-sft-from-goosereason4b-instruct-8gpu-math-code-science-topk32-reverse-kl-baseline
  seed: 42
  logger: '["console","tensorboard","wandb"]'
  n_gpus_per_node: 8
  nnodes: 1
  save_freq: 5
  test_freq: -1
  total_epochs: 3
  total_training_steps: 200
  default_local_dir: checkpoints/MOPD/qwen1p7b-nonthinking-sft-from-goosereason4b-instruct-8gpu-math-code-science-topk32-reverse-kl-baseline
  critic_warmup: 0
  val_before_train: false
  log_val_generations: 10
  max_actor_ckpt_to_keep: 4
  max_critic_ckpt_to_keep: 1

ray_kwargs:
  ray_init:
    include_dashboard: false
    num_cpus: 24
