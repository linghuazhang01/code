# Six-GPU math+code+science Top-32 training profile for Qwen3-4B student
# distillation from Qwen3-30B-A3B-Instruct-2507.
#
# Physical GPU layout:
# - actor/rollout pool: 5 GPUs for Qwen3-4B student + vLLM
# - ref/teacher pool: 1 GPU for Qwen3-30B-A3B-Instruct-2507
#
# Keep trainer.n_gpus_per_node equal to the actor/rollout pool size, because
# verl uses trainer.* as the actor DP world size. Launch with all six GPUs,
# e.g. GPU_IDS=0,1,2,3,4,5.
#
# Audits keep token-gap/entropy vocab vectors and complete response records.
# The only active reweight mechanism is a fixed raw Control-token weight of 4;
# per-domain mean-one normalization remains enabled. The speed controller and
# full/sample/token gradients and other reweight families stay disabled.

runtime:
  python_bin: python
  verl_module: verl.trainer.main_ppo
  wandb_mode: online
  wandb_entity: null
  # Stable ID: create on the first launch and append to the same run on restart.
  wandb_run_id: qwen4b-30b-a3b-6gpu-mcs-control-fixed-w4-b505
  wandb_resume: allow
  env_file: ../mopd/code/.env.local
  used_model: no_api

data:
  domain_train_files:
    math:
      - ../mopd/code/data/G-OPD-Training-Data/DeepMath-103K/train_filtered_level6.parquet
    code:
      - ../mopd/code/data/G-OPD-Training-Data/Eurus/code_train.parquet
    science:
      - ../mopd/code/data/G-OPD-Training-Data/Science/train.parquet
  domain_sampling_weights:
    math: 1
    code: 1
    science: 1
  domain_sampling_replacement: true
  load_parquet_direct: true
  val_files:
    - ../mopd/code/data/eval_data/math/AIME24/test.parquet
    - ../mopd/code/data/eval_data/math/AIME25/test.parquet
    - ../mopd/code/data/eval_data/math/HMMT25Feb/test.parquet
    - ../mopd/code/data/eval_data/math/HMMT25Nov/test.parquet
    - ../mopd/code/data/eval_data/code/HumanEvalPlus/test.parquet
    - ../mopd/code/data/eval_data/code/MBPPPlus/test.parquet
    # Prepare with scripts/prepare_m2rl_eval_data.sh.
    - ../mopd/code/data/eval_data/science/GPQA/test.parquet
    # - data/eval_data/code/LiveCodeBench/test.parquet
  # 505 = 5 actor GPUs x 101 samples.
  train_batch_size: 505
  max_prompt_length: 2048
  max_response_length: 16384
  val_batch_size: 1024
  filter_overlong_prompts: true
  truncation: error
  shuffle: true
  validation_shuffle: false
  seed: 42
  return_raw_chat: true
  enable_thinking: false

model:
  student_path: ../mopd/models/Qwen3-4B
  student_base_path: null
  math_teacher_path: ../mopd/models/Qwen3-30B-A3B-Instruct-2507
  code_teacher_path: ../mopd/models/Qwen3-30B-A3B-Instruct-2507
  domain_teacher_paths:
    math: ../mopd/models/Qwen3-30B-A3B-Instruct-2507
    code: ../mopd/models/Qwen3-30B-A3B-Instruct-2507
    science: ../mopd/models/Qwen3-30B-A3B-Instruct-2507
  teacher_model_device: gpu
  attn_implementation: flash_attention_2

actor:
  learning_rate: "5e-6"
  lr_warmup_steps_ratio: 0.0
  only_reverse_kl_advantages: false
  lambda_vals: 1.0
  multi_teacher_distill: true
  distill_loss_builder: topk_kl
  distill_mode: topk_renormalized_reverse_kl
  topk_distill_enabled: true
  topk_distill_kl_direction: reverse
  topk_distill_k: 32
  topk_distill_support_source: teacher
  topk_distill_tail_bucket: false
  topk_distill_temperature: 1.0
  topk_distill_loss_weight: 1.0
  topk_distill_logprob_chunk_size: 16
  topk_distill_logprob_mode: sparse
  ppo_mini_batch_size: 505
  ppo_micro_batch_size_per_gpu: 1
  use_kl_loss: true
  kl_loss_coef: 0
  kl_loss_type: low_var_kl
  entropy_coeff: 0
  ppo_max_token_len_per_gpu: 32768
  gradient_checkpointing: true
  param_offload: true
  optimizer_offload: true
  fsdp_size: 1
  use_dynamic_bsz: false

rollout:
  calculate_log_probs: true
  log_prob_micro_batch_size_per_gpu: 1
  tensor_model_parallel_size: 1
  name: vllm
  mode: sync
  gpu_memory_utilization: 0.8
  enforce_eager: true
  enable_chunked_prefill: false
  n: 1
  max_num_batched_tokens: 32768
  max_model_len: 18432
  max_num_seqs: 24
  do_sample: true
  temperature: 1.0
  top_p: 1.0
  val_n: 1
  val_do_sample: false
  val_temperature: 0.0
  val_top_p: 1.0
  seed: 42

rollout_correction:
  rollout_is: token
  rollout_is_threshold: 5.0
  rollout_rs: null
  bypass_mode: false

extra_overrides:
  - custom_reward_function.path=mopd_verl/mixed_reward.py
  - custom_reward_function.name=compute_score
  - trainer.resume_mode=auto

worker_placement:
  separate_ref_policy: true
  actor_rollout:
    n_gpus_per_node: 5
    nnodes: 1
  ref_policy:
    n_gpus_per_node: 1
    nnodes: 1

audit:
  enabled: true
  output_dir: audit/qwen4b_30b_a3b_instruct_2507_6gpu_math_code_science_topk32_control_fixed_w4_b505
  domains:
    - math
    - code
    - science
  tensorboard_prefix: mopd
  tensorboard_layout: domain_category
  tensorboard_prune_mode: core
  loss_variance_signal: topk_renormalized_reverse_kl
  max_samples_per_domain: null
  high_variance_cv_threshold: 1.0
  log_sample_level: false
  log_sample_level_freq_steps: 1
  # Preserve complete aligned responses so length, EOS, repetition, and
  # token-level attribution remain available after the run.
  response_level_enabled: true
  response_level_freq_steps: 1
  response_level_compression: gzip
  log_validation_metrics: false
  log_validation_metrics_freq_steps: 1
  tier2_window_size: 20
  calibration_bins: 10
  full_gradient_enabled: false
  full_gradient_freq_steps: 4
  full_grad_training_parity_freq_steps: 1
  full_grad_training_parity_rel_l2_threshold: 2.0e-2
  full_gradient_train_max_samples_per_domain: null
  full_gradient_micro_batch_size_per_gpu: 1
  full_gradient_storage_dtype: bfloat16
  execution_timing: pre_update
  full_gradient_direct_recompute_enabled: false
  sequence_masked_target_enabled: true
  sequence_masked_target_use_as_primary: true
  sequence_replay_skip_non_target_domains: false
  sequence_masked_target_closure_rel_l2_threshold: 0.02
  full_gradient_offload_domain_gradients: true
  sample_gradient_enabled: false
  sample_gradient_freq_steps: 1
  sample_gradient_norm_enabled: false
  sample_gradient_cos_enabled: false
  sample_gradient_cos_freq_steps: 1
  sample_gradient_backward_recompute_enabled: false
  sample_gradient_backward_sync_enabled: false
  sample_gradient_log_sample_level: false
  sample_gradient_log_sample_level_freq_steps: 1
  token_gap_enabled: true
  token_gap_freq_steps: 1
  token_gap_vocab_vector_enabled: true
  token_gap_vocab_vector_freq_steps: 1
  token_gap_vocab_size: null
  vocab_per_occurrence_mean_vector_enabled: true
  logp_vocab_per_occurrence_mean_vector_enabled: true
  logp_abs_vocab_per_occurrence_mean_vector_enabled: true
  entropy_vocab_per_occurrence_mean_vector_enabled: true
  entropy_enabled: true
  entropy_freq_steps: 1
  entropy_vocab_vector_enabled: true
  entropy_vocab_vector_freq_steps: 1
  topk_teacher_student_cross_entropy_vocab_enabled: true
  topk_teacher_student_cross_entropy_vocab_freq_steps: 1
  topk_teacher_student_cross_entropy_k: 32
  topk_teacher_student_cross_entropy_include_tail: false
  topk_teacher_student_cross_entropy_temperature: 1.0
  logp_vector_enabled: true
  logp_vector_freq_steps: 1
  logp_abs_vector_enabled: true
  logp_abs_vector_freq_steps: 1
  token_gradient_enabled: false
  token_gradient_freq_steps: 4
  token_gradient_tail_enabled: false
  token_gradient_tail_fraction: 0.10
  token_gradient_tail_min_tokens: 1
  token_gradient_gap_selection_enabled: false
  token_gradient_gap_abs_selection_enabled: false
  token_gradient_loss_abs_selection_enabled: true
  token_gradient_top_k: null
  token_gradient_top_p_enabled: false
  token_gradient_top_p: 1.0
  token_gradient_log_tokens_jsonl_enabled: true
  token_gradient_strict_grad_restore: false
  token_gradient_backward_recompute_enabled: false
  token_gradient_backward_sync_enabled: false
  dynamic_domain_loss_weighting_enabled: false
  dynamic_domain_loss_weighting_freq_steps: 4
  dynamic_domain_loss_weighting_signal_source: gradient_norm
  dynamic_domain_loss_weighting_ema_beta: 0.90
  dynamic_domain_loss_weighting_weight_ema_beta: 0.90
  dynamic_domain_loss_weighting_alpha: 0.50
  dynamic_domain_loss_weighting_min: 0.3333333333333333
  dynamic_domain_loss_weighting_max: 3.0

  # Frozen per-domain common-support Logic/Control universe. Each token has at
  # least 20 occurrences at every Rising/Stable endpoint in 4B OPD, 1.7B OPD,
  # and 1.7B EOPD; the surface-form taxonomy labels it as logic_control.
  control_token_loss_weighting_enabled: true
  # Fixed raw Control-token weight; mean-one normalization is applied per domain.
  control_token_loss_weight: 4.0
  control_token_ids: []
  domain_control_token_ids:
    # 44 common-supported Math Logic/Control tokens.
    math: [269, 323, 333, 421, 437, 476, 537, 714, 773, 990, 1083, 1142,
      1221, 1416, 1430, 1477, 1576, 1779, 1921, 1988, 2055, 2679, 3110,
      3491, 3983, 4354, 4416, 5005, 5185, 5443, 9112, 9735, 11209, 12209,
      14190, 14312, 14822, 16085, 21453, 21806, 22477, 23910, 44500, 54815]
    # 30 common-supported Code Logic/Control tokens.
    code: [323, 333, 421, 476, 537, 714, 773, 990, 1142, 1221, 1416, 1430,
      1477, 1779, 2055, 2550, 3019, 3491, 4226, 4248, 4396, 5048, 5097,
      5443, 7354, 7379, 9008, 9258, 9735, 13383]
    # 27 common-supported Science Logic/Control tokens.
    science: [323, 421, 476, 537, 714, 773, 990, 1142, 1221, 1416, 1576,
      1921, 2806, 3983, 4226, 4354, 4396, 4416, 5048, 5341, 6959, 11209,
      14312, 16141, 19928, 33092, 44500]
  control_token_normalize_per_domain: true
  control_token_phase_gate_enabled: false
  control_token_span_weighting_enabled: false

  # Disabled: the fixed weight above replaces the dynamic speed controller.
  # The remaining controller values are inert and retained for schema parity.
  control_token_speed_weighting_enabled: false
  control_token_speed_window_steps: 5
  control_token_speed_ema_beta: 0.80
  control_token_speed_update_interval_steps: 2
  control_token_speed_initial_weight: 1.0
  control_token_speed_min_occurrences: 128
  # Inactive reference mapping.
  control_token_speed_weight_knots:
    - [-0.0025, 0.0]
    - [0.0000, 0.2]
    - [0.0050, 2.0]
    - [0.0100, 3.0]
    - [0.0150, 4.0]

  all_domain_shared_token_loss_weighting_enabled: false
  all_domain_shared_token_loss_weight: 1.0
  all_domain_shared_token_selection_mode: per_step_mean_abs_loss
  all_domain_shared_token_top_k: 100
  gradient_fingerprint_enabled: false
  gradient_fingerprint_freq_steps: 1

paper_eval:
  enabled: false
  script_path: eval/scripts/run_paper_eval_suite.sh
  model_path: null
  output_dir: eval_outputs/paper_suite/qwen4b_30b_a3b_instruct_2507_6gpu_math_code_science_topk32_control_fixed_w4_b505
  datasets:
    - aime24
    - aime25
    - hmmt25_feb
    - hmmt25_nov
    - humaneval_plus
    - mbpp_plus
    - lcb
  run_on_initial_validation: true
  evaluate_current_checkpoint: true
  fail_on_error: false
  timeout_seconds: 0

trainer:
  project_name: MOPD
  experiment_name: qwen4b-from-30b-a3b-instruct-2507-6gpu-math-code-science-topk32-control-fixed-w4-b505
  seed: 42
  logger: '["console","tensorboard","wandb"]'
  n_gpus_per_node: 5
  nnodes: 1
  save_freq: 5
  test_freq: -1
  total_epochs: 3
  total_training_steps: 200
  default_local_dir: checkpoints/MOPD/qwen4b-from-30b-a3b-instruct-2507-6gpu-math-code-science-topk32-control-fixed-w4-b505
  critic_warmup: 0
  val_before_train: false
  log_val_generations: 10
  max_actor_ckpt_to_keep: 4
  max_critic_ckpt_to_keep: 1

ray_kwargs:
  ray_init:
    include_dashboard: false
    num_cpus: 24
