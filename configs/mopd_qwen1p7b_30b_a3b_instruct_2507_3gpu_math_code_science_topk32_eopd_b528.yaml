# Three-GPU math+code+science EOPD Top-32 training profile.
#
# Physical layout:
# - actor/rollout: 2 A100 GPUs for the Qwen3-1.7B student
# - ref/teacher: 1 A100 GPU for Qwen3-30B-A3B-Instruct-2507
#
# Batch 528 is the closest practical value to 525: it is divisible by both
# actor workers and all three domains (88 samples per actor per domain).
extends: mopd_qwen1p7b_30b_a3b_instruct_2507_6gpu_math_code_science_topk32_eopd.yaml

runtime:
  python_bin: /home/lzhan37/scratch/opd/miniforge3/envs/mopd-verl-a100/bin/python
  wandb_mode: disabled
  wandb_run_id: null
  wandb_resume: never
  slurm_allocation_gpus: 3
  cuda_visible_devices: null

data:
  train_batch_size: 528

actor:
  ppo_mini_batch_size: 528
  ppo_micro_batch_size_per_gpu: 1

rollout:
  gpu_memory_utilization: 0.60

extra_overrides:
  - custom_reward_function.path=mopd_verl/mixed_reward.py
  - custom_reward_function.name=compute_score
  - trainer.resume_mode=disable

worker_placement:
  separate_ref_policy: true
  actor_rollout:
    n_gpus_per_node: 2
    nnodes: 1
  ref_policy:
    n_gpus_per_node: 1
    nnodes: 1

audit:
  output_dir: audit/qwen1p7b_30b_a3b_instruct_2507_3gpu_math_code_science_topk32_eopd_b528
  # Preserve online EOPD/token diagnostics but avoid replaying full gradients
  # on the smaller actor pool.
  full_gradient_enabled: false
  full_gradient_direct_recompute_enabled: false
  sample_gradient_enabled: false
  token_gradient_enabled: false

paper_eval:
  output_dir: eval_outputs/paper_suite/qwen1p7b_30b_a3b_instruct_2507_3gpu_math_code_science_topk32_eopd_b528

trainer:
  experiment_name: qwen1p7b-from-30b-a3b-instruct-2507-3gpu-math-code-science-topk32-eopd-b528
  logger: '["console","tensorboard"]'
  n_gpus_per_node: 2
  nnodes: 1
  default_local_dir: checkpoints/MOPD/qwen1p7b-from-30b-a3b-instruct-2507-3gpu-math-code-science-topk32-eopd-b528

ray_kwargs:
  ray_init:
    include_dashboard: false
    num_cpus: 24
