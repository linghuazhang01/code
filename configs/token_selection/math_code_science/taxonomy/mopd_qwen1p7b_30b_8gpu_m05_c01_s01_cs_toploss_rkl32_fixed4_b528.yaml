# 2026-10-15 author request: 8-GPU colocated (actor, vLLM rollout and FSDP-8 teacher share all 8 GPUs); teacher batching, fused statistics, compact ids and batched reward on.
# All domains use Control+Structure candidates and pure teacher-support RKL32.
# Top-P covers response occurrences: Math 5%, Code 1%, Science 1%.
extends: mopd_qwen1p7b_30b_a3b_instruct_2507_8gpu_math_code_science_toploss_topp05_fixed4_b528.yaml

runtime:
  slurm_allocation_gpus: 8
  wandb_run_id: q1p7b-8g-mcs-mtl05-ctl01cs-stl01-f4-b528-s60-8c
  wandb_resume: never

data:
  train_batch_size: 528

actor:
  ppo_mini_batch_size: 528
  distill_loss_builder: topk_kl
  distill_mode: topk_renormalized_reverse_kl
  topk_distill_enabled: true
  topk_distill_kl_direction: reverse
  topk_distill_k: 32
  topk_distill_support_source: teacher
  topk_distill_tail_bucket: false
  topk_distill_temperature: 1.0
  topk_distill_loss_by_domain: {}

worker_placement:
  separate_ref_policy: false
  actor_rollout: {n_gpus_per_node: 8, nnodes: 1}
  ref_policy: {n_gpus_per_node: null, nnodes: null, process_on_nodes: null}

teacher_performance:
  enabled: true
  topk_logprob_chunk_size: 1024
  max_micro_batch_size: 32
  max_tokens: 57344
  moe_dispatch: stable_sort
  memory_margin_gib: 12.0
  fused_statistics: true
  compact_topk_ids: true

audit:
  control_token_online_top_p_by_domain:
    math: 0.05
    code: 0.01
    science: 0.01
  control_token_online_selection_mode: top_loss
  control_token_online_selection_mode_by_domain:
    math: top_loss
    code: top_loss
    science: top_loss
  control_token_online_weight_mode: fixed
  control_token_online_weight_mode_by_domain:
    math: fixed
    code: fixed
    science: fixed
  control_token_loss_weight: 4.0
  control_token_normalize_per_domain: true
  output_dir: audit/q1p7b-8g-mcs-mtl05-ctl01cs-stl01-f4-b528-s60-8c

paper_eval:
  output_dir: eval_outputs/paper_suite/q1p7b-8g-mcs-mtl05-ctl01cs-stl01-f4-b528-s60-8c

huggingface_checkpoint:
  enabled: true
  steps: [60]
  private: false
  path_prefix: checkpoints/mopd/q1p7b-8g-mcs-mtl05-ctl01cs-stl01-f4-b528-s60-8c

trainer:
  experiment_name: q1p7b-8g-mcs-mtl05-ctl01cs-stl01-f4-b528-s60-8c
  n_gpus_per_node: 8
  total_training_steps: 60
  save_freq: 1
  default_local_dir: checkpoints/MOPD/q1p7b-8g-mcs-mtl05-ctl01cs-stl01-f4-b528-s60-8c
# 2026-10-15 speed/robustness update: fused teacher statistics, compact Top-K ids,
# batched reward grader (spawn pool, 120 s hard timeout; timed-out samples score 0).
extra_overrides:
- custom_reward_function.path=mopd_verl/mixed_reward.py
- custom_reward_function.name=compute_score_batched
- reward_model.reward_manager=batch
- trainer.resume_mode=disable
- actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]
- actor_rollout_ref.ref.fsdp_config.fsdp_size=8
rollout:
  gpu_memory_utilization: 0.75
