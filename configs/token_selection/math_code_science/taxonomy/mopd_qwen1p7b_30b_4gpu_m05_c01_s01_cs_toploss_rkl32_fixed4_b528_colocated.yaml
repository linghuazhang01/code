# Four-GPU co-located version; preserve all-domain C+S / TopLoss / RKL32.
extends: mopd_qwen1p7b_30b_8gpu_m05_c01_s01_cs_toploss_rkl32_fixed4_b528.yaml

runtime:
  slurm_allocation_gpus: 4
  wandb_run_id: q1p7b-4g-mcs-mtl05-ctl01cs-stl01-f4-b528-coloc-s60
  wandb_resume: never

worker_placement:
  separate_ref_policy: false
  actor_rollout: {n_gpus_per_node: 4, nnodes: 1}
  ref_policy: {n_gpus_per_node: null, nnodes: null, process_on_nodes: null}

teacher_performance:
  # The optimized reference wrapper requires separate teacher workers.
  enabled: true

audit:
  output_dir: audit/q1p7b-4g-mcs-mtl05-ctl01cs-stl01-f4-b528-coloc-s60

paper_eval:
  output_dir: eval_outputs/paper_suite/q1p7b-4g-mcs-mtl05-ctl01cs-stl01-f4-b528-coloc-s60

huggingface_checkpoint:
  path_prefix: checkpoints/mopd/q1p7b-4g-mcs-mtl05-ctl01cs-stl01-f4-b528-coloc-s60

trainer:
  experiment_name: q1p7b-4g-mcs-mtl05-ctl01cs-stl01-f4-b528-coloc-s60
  n_gpus_per_node: 4
  default_local_dir: checkpoints/MOPD/q1p7b-4g-mcs-mtl05-ctl01cs-stl01-f4-b528-coloc-s60
extra_overrides:
- custom_reward_function.path=mopd_verl/mixed_reward.py
- custom_reward_function.name=compute_score_batched
- reward_model.reward_manager=batch
- trainer.resume_mode=disable
- actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]
- actor_rollout_ref.ref.fsdp_config.fsdp_size=2
rollout:
  gpu_memory_utilization: 0.6
