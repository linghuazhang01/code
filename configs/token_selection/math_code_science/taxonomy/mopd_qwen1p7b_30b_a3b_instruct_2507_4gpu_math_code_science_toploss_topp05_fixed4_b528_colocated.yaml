# Four-GPU co-located MOPD taxonomy selector: Top-P 5% with Fixed4 weighting.
# Math/Code/Science use the active full-vocabulary taxonomy inherited from the
# 8GPU profile. Student and teacher share the same four actor/rollout workers.
extends: mopd_qwen1p7b_30b_a3b_instruct_2507_8gpu_math_code_science_toploss_topp05_fixed4_b528.yaml

runtime:
  slurm_allocation_gpus: 4
  wandb_run_id: q1p7b-4g-mcs-taxonomy-toploss-topp05-fixed4-b528-colocated-s60
  wandb_resume: never

worker_placement:
  separate_ref_policy: false
  actor_rollout: {n_gpus_per_node: 4, nnodes: 1}
  # No independent ref pool: ref/teacher is bound to actor_rollout workers.
  ref_policy: {n_gpus_per_node: null, nnodes: null, process_on_nodes: null}

extra_overrides:
  - custom_reward_function.path=mopd_verl/mixed_reward.py
  - custom_reward_function.name=compute_score
  - trainer.resume_mode=disable
  - actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]

teacher_performance:
  # The optimized wrapper requires a single-rank reference worker. The
  # co-located reference model is four-rank FSDP, so use the stock path.
  enabled: false

audit:
  output_dir: audit/q1p7b-4g-mcs-taxonomy-toploss-topp05-fixed4-b528-colocated-s60

paper_eval:
  output_dir: eval_outputs/paper_suite/q1p7b-4g-mcs-taxonomy-toploss-topp05-fixed4-b528-colocated-s60

huggingface_checkpoint:
  path_prefix: checkpoints/mopd/q1p7b-4g-mcs-taxonomy-toploss-topp05-fixed4-b528-colocated-s60

trainer:
  experiment_name: q1p7b-4g-mcs-taxonomy-toploss-topp05-fixed4-b528-colocated-s60
  n_gpus_per_node: 4
  default_local_dir: checkpoints/MOPD/q1p7b-4g-mcs-taxonomy-toploss-topp05-fixed4-b528-colocated-s60
