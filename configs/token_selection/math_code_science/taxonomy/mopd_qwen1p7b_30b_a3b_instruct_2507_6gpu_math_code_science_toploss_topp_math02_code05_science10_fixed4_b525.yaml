# Six-GPU MOPD taxonomy selector with per-domain Top-P budgets.
# Ordered as math=2%, code=5%, science=10%; topology is 5 actor + 1 ref GPU.
extends: mopd_qwen1p7b_30b_a3b_instruct_2507_8gpu_math_code_science_toploss_topp_math02_code05_science10_fixed4_b528.yaml

runtime:
  slurm_allocation_gpus: 6
  wandb_run_id: q1p7b-6g-mcs-pd-m02-c05-s10-f4-b525-s60
  wandb_resume: never

data:
  train_batch_size: 525

actor:
  ppo_mini_batch_size: 525

worker_placement:
  separate_ref_policy: true
  actor_rollout: {n_gpus_per_node: 5, nnodes: 1}
  ref_policy: {n_gpus_per_node: 1, nnodes: 1}

extra_overrides:
  - custom_reward_function.path=mopd_verl/mixed_reward.py
  - custom_reward_function.name=compute_score
  - trainer.resume_mode=disable
  - actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]
  - actor_rollout_ref.ref.fsdp_config.fsdp_size=1

audit:
  output_dir: audit/q1p7b-6g-mcs-taxonomy-toploss-topp-m02-c05-s10-fixed4-b525-s60

paper_eval:
  output_dir: eval_outputs/paper_suite/q1p7b-6g-mcs-taxonomy-toploss-topp-m02-c05-s10-fixed4-b525-s60

huggingface_checkpoint:
  path_prefix: checkpoints/mopd/q1p7b-6g-mcs-taxonomy-toploss-topp-m02-c05-s10-fixed4-b525-s60

trainer:
  experiment_name: q1p7b-6g-mcs-taxonomy-toploss-topp-m02-c05-s10-fixed4-b525-s60
  n_gpus_per_node: 5
  default_local_dir: checkpoints/MOPD/q1p7b-6g-mcs-taxonomy-toploss-topp-m02-c05-s10-fixed4-b525-s60
