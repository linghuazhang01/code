# Four-GPU co-located MOPD taxonomy selector with per-domain Top-P budgets.
# Math/Code/Science are enabled; Code uses Structure tokens only.
# The teacher and student share the same four actor/rollout workers.
extends: mopd_qwen1p7b_30b_a3b_instruct_2507_8gpu_math_code_structure_only_toploss_topp05_fixed4_b528.yaml

runtime:
  slurm_allocation_gpus: 4
  wandb_run_id: q1p7b-4g-mcs-struct-tl-m05-c02-s05-f4-b528-coloc-s60
  wandb_resume: never

data:
  train_batch_size: 528

actor:
  ppo_mini_batch_size: 528

worker_placement:
  separate_ref_policy: false
  actor_rollout: {n_gpus_per_node: 4, nnodes: 1}
  # No independent ref pool: the reference/teacher is bound to actor workers.
  ref_policy: {n_gpus_per_node: null, nnodes: null, process_on_nodes: null}

teacher_performance:
  # The optimized wrapper requires a single-rank reference worker; co-located
  # teacher/student execution uses the stock reference path.
  enabled: false

audit:
  domains: [math, code, science]
  control_token_online_audit_interval_steps: 1
  control_token_online_window_steps: 1
  control_token_online_budget_mode: top_p
  control_token_online_top_p: 0.05
  control_token_online_top_p_by_domain:
    math: 0.05
    code: 0.02
    science: 0.05
  output_dir: audit/q1p7b-4g-mcs-struct-tl-m05-c02-s05-f4-b528-coloc-s60

paper_eval:
  output_dir: eval_outputs/paper_suite/q1p7b-4g-mcs-struct-tl-m05-c02-s05-f4-b528-coloc-s60

huggingface_checkpoint:
  path_prefix: checkpoints/mopd/q1p7b-4g-mcs-struct-tl-m05-c02-s05-f4-b528-coloc-s60

trainer:
  experiment_name: q1p7b-4g-mcs-struct-tl-m05-c02-s05-f4-b528-coloc-s60
  n_gpus_per_node: 4
  default_local_dir: checkpoints/MOPD/q1p7b-4g-mcs-struct-tl-m05-c02-s05-f4-b528-coloc-s60
