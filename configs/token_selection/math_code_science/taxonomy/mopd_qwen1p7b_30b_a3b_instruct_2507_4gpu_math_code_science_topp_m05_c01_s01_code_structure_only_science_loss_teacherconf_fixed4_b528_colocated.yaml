# Four-GPU co-located MOPD selector with domain-specific metrics and budgets.
# Math keeps TopLoss at Top-P 5%; Code keeps TopLoss at Top-P 1%. Science uses
# robust-normalized TopLoss + chosen-token teacher confidence + interaction at Top-P 1%.
# Confidence is p_T(y_t | c_t), aggregated through mean chosen-token log-prob
# per token type, then Q2--Q98 clipped and min-max normalized within domain.
# Code keeps only its Structure candidate group; Science keeps its full taxonomy.
extends: mopd_qwen1p7b_30b_a3b_instruct_2507_8gpu_math_code_structure_only_toploss_topp05_fixed4_b528.yaml

runtime:
  slurm_allocation_gpus: 4
  wandb_run_id: q1p7b-4g-mcs-mtl05-ctl01-sltc01-f4-b528-coloc-s60
  wandb_resume: never

data:
  train_batch_size: 528

actor:
  ppo_mini_batch_size: 528

worker_placement:
  separate_ref_policy: false
  actor_rollout: {n_gpus_per_node: 4, nnodes: 1}
  # The reference/teacher is co-located with the actor workers.
  ref_policy: {n_gpus_per_node: null, nnodes: null, process_on_nodes: null}

teacher_performance:
  # The optimized wrapper requires a separate single-rank reference worker.
  enabled: false

audit:
  domains: [math, code, science]
  control_token_online_audit_interval_steps: 1
  control_token_online_window_steps: 1
  control_token_online_budget_mode: top_p
  control_token_online_top_p: 0.05
  control_token_online_top_p_by_domain:
    math: 0.05
    code: 0.01
    science: 0.01
  control_token_online_selection_mode: top_loss
  control_token_online_selection_mode_by_domain:
    math: top_loss
    code: top_loss
    science: top_loss_teacher_confidence
  control_token_online_weight_mode: fixed
  control_token_online_weight_mode_by_domain:
    math: fixed
    code: fixed
    science: fixed
  output_dir: audit/q1p7b-4g-mcs-mtl05-ctl01-sltc01-f4-b528-coloc-s60

paper_eval:
  output_dir: eval_outputs/paper_suite/q1p7b-4g-mcs-mtl05-ctl01-sltc01-f4-b528-coloc-s60

huggingface_checkpoint:
  path_prefix: checkpoints/mopd/q1p7b-4g-mcs-mtl05-ctl01-sltc01-f4-b528-coloc-s60

trainer:
  experiment_name: q1p7b-4g-mcs-mtl05-ctl01-sltc01-f4-b528-coloc-s60
  n_gpus_per_node: 4
  default_local_dir: checkpoints/MOPD/q1p7b-4g-mcs-mtl05-ctl01-sltc01-f4-b528-coloc-s60
