# Mixed KL routing before token selection and weighting.
# Code retains Structure-only weighting candidates; Code Control still uses FKL.
# All unselected Control positions also use FKL; Structure/Other use RKL.
extends: mopd_qwen1p7b_30b_a3b_instruct_2507_4gpu_math_code_science_topp_m05_c01_s01_code_structure_only_science_loss_teacherconf_fixed4_b528_colocated.yaml

runtime:
  wandb_run_id: q1p7b-4g-mcs-m05c01s01-stloss-cfkl-srkl-f4-b528-coloc-s60
  wandb_resume: never

actor:
  distill_loss_builder: topk_kl
  distill_mode: topk_renormalized_reverse_kl
  topk_distill_enabled: true
  topk_distill_k: 32
  topk_distill_support_source: teacher
  topk_distill_tail_bucket: false
  topk_distill_temperature: 1.0
  topk_distill_loss_by_domain:
    default:
      control: forward
      structure: reverse
      other: reverse

audit:
  control_token_online_selection_mode_by_domain:
    math: top_loss
    code: top_loss
    science: top_loss
  output_dir: audit/q1p7b-4g-mcs-m05c01s01-stloss-cfkl-srkl-f4-b528-coloc-s60

paper_eval:
  output_dir: eval_outputs/paper_suite/q1p7b-4g-mcs-m05c01s01-stloss-cfkl-srkl-f4-b528-coloc-s60

huggingface_checkpoint:
  path_prefix: checkpoints/mopd/q1p7b-4g-mcs-m05c01s01-stloss-cfkl-srkl-f4-b528-coloc-s60

trainer:
  experiment_name: q1p7b-4g-mcs-m05c01s01-stloss-cfkl-srkl-f4-b528-coloc-s60
