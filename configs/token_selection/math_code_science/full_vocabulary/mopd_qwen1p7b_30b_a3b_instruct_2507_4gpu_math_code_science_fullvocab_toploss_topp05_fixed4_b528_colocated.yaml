# Four-GPU full-tokenizer-vocabulary ablation: Top-Loss Top-P=5%, Fixed4.
# This mirrors the taxonomy Top-P=5% run while changing only the online
# selector candidate universe from configured Control/Structure IDs to every
# valid response token ID observed in the tokenizer vocabulary.
extends: ../../../mopd_qwen1p7b_30b_a3b_instruct_2507_5gpu_math_code_science_topk32_baseline_b528.yaml

runtime:
  slurm_allocation_gpus: 4
  wandb_run_id: q1p7b-4g-mcs-fullvocab-toploss-topp05-fixed4-b528-colocated-s60
  wandb_resume: never

data:
  train_batch_size: 528

actor:
  ppo_mini_batch_size: 528

worker_placement:
  separate_ref_policy: false
  actor_rollout: {n_gpus_per_node: 4, nnodes: 1}
  ref_policy: {n_gpus_per_node: null, nnodes: null, process_on_nodes: null}

extra_overrides:
  - custom_reward_function.path=mopd_verl/mixed_reward.py
  - custom_reward_function.name=compute_score
  - trainer.resume_mode=disable
  - actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]

teacher_performance:
  enabled: false

audit:
  domains: [math, code, science]
  loss_variance_signal: opd_loss_token
  control_token_loss_weighting_enabled: true
  control_token_loss_weight: 4.0
  control_token_ids: []
  domain_control_token_ids: {}
  control_token_candidate_ids: []
  domain_control_token_candidate_ids: {}
  domain_control_token_candidate_groups: {}
  control_token_online_candidate_scope: full_vocabulary
  # null means infer len(tokenizer); the model embedding vocabulary must cover it.
  control_token_online_candidate_vocab_size: null
  control_token_normalize_per_domain: true
  control_token_online_selection_enabled: true
  control_token_online_audit_interval_steps: 1
  control_token_online_window_steps: 1
  control_token_online_min_mean_occurrences_per_step: 20.0
  control_token_online_strict_occurrence_gate: true
  control_token_online_top_k: 30
  control_token_online_top_k_per_group: null
  control_token_online_budget_mode: top_p
  control_token_online_top_p: 0.05
  control_token_online_top_p_by_domain: {}
  control_token_online_selection_mode: top_loss
  control_token_online_selection_mode_by_domain: {}
  control_token_online_weight_mode: fixed
  control_token_online_weight_mode_by_domain: {}
  output_dir: audit/q1p7b-4g-mcs-fullvocab-toploss-topp05-fixed4-b528-colocated-s60

paper_eval:
  output_dir: eval_outputs/paper_suite/q1p7b-4g-mcs-fullvocab-toploss-topp05-fixed4-b528-colocated-s60

huggingface_checkpoint:
  enabled: true
  steps: [60]
  repo_id: icemoon28/opd-checkpoints
  private: false
  path_prefix: checkpoints/mopd/q1p7b-4g-mcs-fullvocab-toploss-topp05-fixed4-b528-colocated-s60
  token_env_var: HF_TOKEN
  env_file: null

trainer:
  experiment_name: q1p7b-4g-mcs-fullvocab-toploss-topp05-fixed4-b528-colocated-s60
  n_gpus_per_node: 4
  total_training_steps: 60
  default_local_dir: checkpoints/MOPD/q1p7b-4g-mcs-fullvocab-toploss-topp05-fixed4-b528-colocated-s60
