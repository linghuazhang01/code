# Shared Math-only online token-selector profile.
#
# Topology: 3 actor/rollout GPUs + 1 ref/teacher GPU.
# Global batch: 255 = 3 actor GPUs x 85 prompts.
# Selector metric A: occurrence-weighted mean absolute chosen-token logp diff,
# |teacher_logp - student_logp|. Selection is applied from the next optimizer
# step with fixed raw weight 4 and per-domain mean-one normalization.
extends: ../../baselines/math/_common.yaml

runtime:
  slurm_allocation_gpus: 4
  wandb_resume: never

data:
  train_batch_size: 255

actor:
  multi_teacher_distill: false
  distill_loss_builder: topk_kl
  distill_mode: topk_renormalized_reverse_kl
  token_baseline_method: none
  topk_distill_enabled: true
  topk_distill_kl_direction: reverse
  topk_distill_k: 32
  topk_distill_support_source: teacher
  topk_distill_tail_bucket: false
  topk_distill_temperature: 1.0
  topk_distill_loss_weight: 1.0
  topk_distill_logprob_chunk_size: 16
  topk_distill_logprob_mode: sparse
  ppo_mini_batch_size: 255

worker_placement:
  separate_ref_policy: true
  actor_rollout: {n_gpus_per_node: 3, nnodes: 1}
  ref_policy: {n_gpus_per_node: 1, nnodes: 1}

audit:
  domains: [math]
  loss_variance_signal: opd_loss_token
  log_sample_level: false
  response_level_enabled: false
  log_validation_metrics: false
  full_gradient_enabled: false
  sample_gradient_enabled: false
  token_gradient_enabled: false

  # Preserve the vectors required to replay Metric A and future Top-200.
  token_gap_enabled: true
  token_gap_freq_steps: 1
  token_gap_vocab_vector_enabled: true
  token_gap_vocab_vector_freq_steps: 1
  logp_vocab_per_occurrence_mean_vector_enabled: true
  logp_abs_vocab_per_occurrence_mean_vector_enabled: true
  logp_vector_enabled: true
  logp_vector_freq_steps: 1
  logp_abs_vector_enabled: true
  logp_abs_vector_freq_steps: 1
  entropy_enabled: false
  entropy_vocab_vector_enabled: false
  topk_teacher_student_cross_entropy_vocab_enabled: false

  control_token_loss_weighting_enabled: true
  control_token_loss_weight: 4.0
  control_token_ids: []
  domain_control_token_ids: {}
  control_token_candidate_ids: []
  domain_control_token_candidate_ids: {}
  control_token_normalize_per_domain: true
  control_token_online_selection_enabled: false
  control_token_online_min_mean_occurrences_per_step: 20.0
  # Match the replay gate: every source-window step must be strictly >20.
  control_token_online_strict_occurrence_gate: true
  control_token_online_selection_mode: top_logp_diff
  control_token_online_weight_mode: fixed

  control_token_phase_gate_enabled: false
  control_token_span_weighting_enabled: false
  control_token_speed_weighting_enabled: false

paper_eval:
  datasets: [aime24, aime25, hmmt25_feb, hmmt25_nov]

trainer:
  n_gpus_per_node: 3
