# Qwen3-1.7B math-only equal-weight Top-32 RKL OPD reference on three colocated GPUs (batch 255 = 3 x 85).
# Identical to uniform_top32kl_no_weighting_4gpu_3a1t_b255.yaml except GPU placement, 60 steps (author rule) and run names.
# Three colocated GPUs (actor, vLLM rollout and the FSDP-3 teacher share every GPU); placement, vLLM memory and the
# teacher fused-statistics / compact-ids settings follow the Qwen3-4B 3gpu_3c profile that completed 60 steps.
extends: uniform_top32kl_no_weighting_4gpu_3a1t_b255.yaml
runtime:
  slurm_allocation_gpus: 3
  wandb_run_id: q1p7b-math-top32kl-uniform-noweight-3g3c-b255
  wandb_resume: never
rollout:
  gpu_memory_utilization: 0.4
worker_placement:
  separate_ref_policy: false
  actor_rollout:
    n_gpus_per_node: 3
    nnodes: 1
  ref_policy:
    n_gpus_per_node: null
    nnodes: null
    process_on_nodes: null
teacher_performance:
  fused_statistics: true
  compact_topk_ids: true
trainer:
  n_gpus_per_node: 3
  experiment_name: q1p7b-math-top32kl-uniform-noweight-3g3c-b255
  default_local_dir: checkpoints/MOPD/q1p7b-math-top32kl-uniform-noweight-3g3c-b255
  total_training_steps: 60
extra_overrides:
- custom_reward_function.path=mopd_verl/mixed_reward.py
- custom_reward_function.name=compute_score
- trainer.resume_mode=disable
- actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]
- actor_rollout_ref.ref.fsdp_config.fsdp_size=3
audit:
  output_dir: audit/q1p7b-math-top32kl-uniform-noweight-3g3c-b255
paper_eval:
  output_dir: eval_outputs/paper_suite/q1p7b-math-top32kl-uniform-noweight-3g3c-b255
huggingface_checkpoint:
  path_prefix: checkpoints/math/q1p7b-math-top32kl-uniform-noweight-3g3c-b255
  steps: [60]
