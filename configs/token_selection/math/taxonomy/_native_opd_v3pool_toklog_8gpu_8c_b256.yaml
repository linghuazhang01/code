# Qwen3-1.7B math-only native OPD ("OPD naive": chosen-token policy gradient, G-OPD lambda=1) with fixed v3-pool position
# weights and per-token logging, 8 colocated GPUs (actor, vLLM rollout and FSDP-8 teacher share every GPU), global batch 256.
# Not launchable by itself: native_opd_v3pool_{ignore,only}_toklog_8gpu_8c_b256.yaml set the two weights and the run names.
# Base: native_opd_toklog_3gpu_3c_b255.yaml (the equal-weight naive run q1p7b-math-opdnative-toklog-3g3c-b255). This file changes
# only the topology (3 -> 8 colocated GPUs, batch 255 -> 256 by the 8-GPU batch rule) and adds the weighting block.
# Pool = the Math pool of the Top-32 v3 ignore/only runs (_v3pool_fixed_top32kl_3gpu_3c_b255.yaml): 98 IDs.
# Purpose and weighting semantics: configs/qwen1p7b_suite/math_code/_opd_native_v3pool_toklog_8gpu_8c_b256.yaml.
extends: native_opd_toklog_3gpu_3c_b255.yaml
runtime:
  slurm_allocation_gpus: 8
data:
  train_batch_size: 256
actor:
  ppo_mini_batch_size: 256
worker_placement:
  separate_ref_policy: false
  actor_rollout:
    n_gpus_per_node: 8
    nnodes: 1
trainer:
  n_gpus_per_node: 8
ray_kwargs:
  ray_init:
    num_cpus: 48
# Lists replace the parent's list, so the reference FSDP size is restated here.
extra_overrides:
- custom_reward_function.path=mopd_verl/mixed_reward.py
- custom_reward_function.name=compute_score_batched
- reward_model.reward_manager=batch
- trainer.resume_mode=disable
- actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]
- actor_rollout_ref.ref.fsdp_config.fsdp_size=8
audit:
  control_token_loss_weighting_enabled: true
  control_token_online_selection_enabled: false
  control_token_normalize_per_domain: false
  control_token_phase_gate_enabled: false
  control_token_span_weighting_enabled: false
  control_token_speed_weighting_enabled: false
  control_token_ids: []
  domain_control_token_ids:
    math: [
      269, 304, 323, 369, 382, 389, 421, 437, 438, 448, 476, 504, 510, 553, 624, 641,
      704, 758, 773, 1083, 1156, 1172, 1221, 1249, 1283, 1416, 1447, 1499, 1576, 1597, 1694, 1752,
      1790, 1913, 1925, 1986, 2012, 2041, 2055, 2058, 2121, 2195, 2461, 2661, 2679, 2870, 2938, 3036,
      3243, 3830, 3983, 4192, 4226, 4416, 4623, 5005, 5542, 6260, 6762, 7039, 8450, 8704, 9064, 9112,
      9577, 9658, 11209, 11284, 12209, 12549, 12824, 13023, 13394, 14223, 14512, 15277, 16085, 16448, 17949, 19357,
      21806, 22043, 24391, 27427, 27653, 31040, 38770, 39365, 41968, 44500, 47446, 54815, 62965, 67691, 73877, 74123,
      85545, 90408
    ]
