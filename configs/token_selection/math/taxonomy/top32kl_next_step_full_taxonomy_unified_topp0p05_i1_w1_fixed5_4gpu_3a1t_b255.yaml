# Math FullTaxonomy TopLoss TopP5%, raw selected:other weight = 5:1.
# 3 actor/rollout GPUs + 1 teacher GPU; batch 255 is divisible by 3.
# Preserve the original selector, normalization, seeds and training schedule.
extends: top32kl_next_step_full_taxonomy_split_topp0p05_i1_w1_5gpu_b256.yaml

runtime:
  slurm_allocation_gpus: 4
  wandb_run_id: q1p7b-taxonomy-toploss-topp05-fixed5-4g3a1t-b255
  wandb_resume: never

data:
  train_batch_size: 255

actor:
  ppo_mini_batch_size: 255

worker_placement:
  actor_rollout: {n_gpus_per_node: 3, nnodes: 1}
  ref_policy: {n_gpus_per_node: 1, nnodes: 1}

audit:
  control_token_online_selection_mode: top_loss
  control_token_online_weight_mode: fixed
  control_token_loss_weight: 5.0
  output_dir: audit/q1p7b-taxonomy-toploss-topp05-fixed5-4g3a1t-b255

paper_eval:
  output_dir: eval_outputs/paper_suite/q1p7b-taxonomy-toploss-topp05-fixed5-4g3a1t-b255

huggingface_checkpoint:
  path_prefix: checkpoints/math/q1p7b-taxonomy-toploss-topp05-fixed5-4g3a1t-b255

trainer:
  max_actor_ckpt_to_keep: 2
  experiment_name: q1p7b-taxonomy-toploss-topp05-fixed5-4g3a1t-b255
  n_gpus_per_node: 3
  default_local_dir: checkpoints/MOPD/q1p7b-taxonomy-toploss-topp05-fixed5-4g3a1t-b255
