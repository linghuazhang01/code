# Five-GPU Top-P=0.10 overlay: 3 actor/rollout GPUs + 2 sharded teacher GPUs.
extends: top32kl_next_step_full_taxonomy_split_topp0p1_i1_w1_6gpu_4a2t_b256.yaml

runtime:
  slurm_allocation_gpus: 5
  wandb_run_id: q1p7b-math-top32kl-ns-taxonomy-topp0p1-i1w1-5gpu-3a2t-b258-avg4

data:
  train_batch_size: 258

actor:
  ppo_mini_batch_size: 258

worker_placement:
  actor_rollout: {n_gpus_per_node: 3, nnodes: 1}

audit:
  output_dir: audit/q1p7b-math-top32kl-ns-taxonomy-topp0p1-i1w1-5gpu-3a2t-b258-avg4
  control_token_online_budget_mode: top_p
  control_token_online_top_p: 0.1
  control_token_online_top_k_per_group: null

paper_eval:
  output_dir: eval_outputs/paper_suite/q1p7b-math-top32kl-ns-taxonomy-topp0p1-i1w1-5gpu-3a2t-b258-avg4

huggingface_checkpoint:
  path_prefix: checkpoints/math/q1p7b-math-top32kl-ns-taxonomy-topp0p1-i1w1-5gpu-3a2t-b258-avg4

trainer:
  experiment_name: q1p7b-math-top32kl-ns-taxonomy-topp0p1-i1w1-5gpu-3a2t-b258-avg4
  n_gpus_per_node: 3
  default_local_dir: checkpoints/MOPD/q1p7b-math-top32kl-ns-taxonomy-topp0p1-i1w1-5gpu-3a2t-b258-avg4

# Validation Avg@4. verl reports this metric as reward/mean@4.
rollout:
  val_n: 4
  val_do_sample: true
  val_temperature: 1.0
  val_top_p: 1.0

extra_overrides:
  - custom_reward_function.path=mopd_verl/mixed_reward.py
  - custom_reward_function.name=compute_score_batched
  - +custom_reward_function.reward_kwargs.max_workers=32
  - +custom_reward_function.reward_kwargs.batch_timeout_seconds=120.0
  - reward_model.reward_manager=batch
  - trainer.resume_mode=disable
  - actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]
  - actor_rollout_ref.ref.fsdp_config.fsdp_size=2
