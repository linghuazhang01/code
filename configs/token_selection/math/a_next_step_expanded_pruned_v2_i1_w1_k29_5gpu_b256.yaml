# Five-GPU resource overlay for the frozen next-step ExpandedPruned-V2 optimum.
# Topology: 4 actor/rollout GPUs + 1 ref/teacher GPU; global batch size 256.
extends: a_next_step_expanded_pruned_v2_i1_w1_k29_4gpu_b255.yaml

runtime:
  slurm_allocation_gpus: 5
  wandb_run_id: q1p7b-math-a-ns-expanded-v2-i1w1k29-5gpu-b256

data:
  train_batch_size: 256

actor:
  ppo_mini_batch_size: 256

worker_placement:
  actor_rollout: {n_gpus_per_node: 4, nnodes: 1}
  ref_policy: {n_gpus_per_node: 1, nnodes: 1}

audit:
  output_dir: audit/q1p7b-math-a-ns-expanded-v2-i1w1k29-5gpu-b256

paper_eval:
  output_dir: eval_outputs/paper_suite/q1p7b-math-a-ns-expanded-v2-i1w1k29-5gpu-b256

huggingface_checkpoint:
  path_prefix: checkpoints/math/q1p7b-math-a-ns-expanded-v2-i1w1k29-5gpu-b256

trainer:
  experiment_name: q1p7b-math-a-ns-expanded-v2-i1w1k29-5gpu-b256
  n_gpus_per_node: 4
  default_local_dir: checkpoints/MOPD/q1p7b-math-a-ns-expanded-v2-i1w1k29-5gpu-b256
