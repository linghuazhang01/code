# Standalone resolved config: no extends. Four-baseline FullTaxonomy next-window Type-F1 optimum.
# Metric A, cadence=6, window=6, K=32 independently for Control and Structure.
runtime:
  python_bin: /home/shuang_qiu/env/miniconda3/envs/mopd-verl/bin/python
  verl_module: verl.trainer.main_ppo
  wandb_mode: online
  wandb_entity: lz101-rice-university
  env_file: .env.local
  used_model: no_api
  wandb_resume: never
  cuda_visible_devices: null
  slurm_allocation_gpus: 4
  wandb_run_id: q1p7b-math-a-nw-taxonomy-split-i6w6k32pt-b255
data:
  domain_train_files:
    math:
