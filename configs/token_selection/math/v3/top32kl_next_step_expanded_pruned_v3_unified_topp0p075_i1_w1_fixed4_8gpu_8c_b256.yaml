# 2026-10-15 author request: 8-GPU colocated (actor, vLLM rollout and FSDP-8 teacher share all 8 GPUs); teacher batching, fused statistics, compact ids and batched reward on.
# V3 Math pool: 115 unified tokens (85 Control + 30 Structure).
# Rank candidate types by occurrence-mean absolute configured Top32 KL loss.
# Use the existing top_loss selector; selected weights are fixed, not loss-ratio weights.
# Top-P=0.075 is all-valid-token occurrence coverage, with strict >20 and i1/w1.
# Selected raw weight remains fixed4 (others1), before domain normalization.
# Retain Top32 reverse-KL, 6 actor + 2 teacher GPUs, and batch258.
extends: a_next_step_expanded_pruned_v3_unified_i1_w1_k25_8gpu_8c_b256.yaml

runtime:
  wandb_run_id: q1p7b-math-top32kl-v3-topp075-w4-8g8c-b256

  slurm_allocation_gpus: 8
audit:
  control_token_online_selection_mode: top_loss
  control_token_online_budget_mode: top_p
  control_token_online_top_p: 0.075
  control_token_online_top_k_per_group: null
  control_token_online_weight_mode: fixed
  control_token_loss_weight: 4.0
  control_token_loss_ratio_alpha: 1.0
  output_dir: audit/q1p7b-math-top32kl-v3-topp075-w4-8g8c-b256

paper_eval:
  output_dir: eval_outputs/paper_suite/q1p7b-math-top32kl-v3-topp075-w4-8g8c-b256

huggingface_checkpoint:
  path_prefix: checkpoints/math/q1p7b-math-top32kl-v3-topp075-w4-8g8c-b256

trainer:
  experiment_name: q1p7b-math-top32kl-v3-topp075-w4-8g8c-b256
  default_local_dir: checkpoints/MOPD/q1p7b-math-top32kl-v3-topp075-w4-8g8c-b256

# Preserve the original reference run reward path while changing the token pool.
  n_gpus_per_node: 8
extra_overrides:
- custom_reward_function.path=mopd_verl/mixed_reward.py
- custom_reward_function.name=compute_score_batched
- reward_model.reward_manager=batch
- trainer.resume_mode=disable
- actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]
- actor_rollout_ref.ref.fsdp_config.fsdp_size=8
teacher_performance:
  fused_statistics: true
  compact_topk_ids: true
  enabled: true
data:
  train_batch_size: 256
actor:
  ppo_mini_batch_size: 256
rollout:
  gpu_memory_utilization: 0.6
worker_placement:
  separate_ref_policy: false
  actor_rollout:
    n_gpus_per_node: 8
    nnodes: 1
  ref_policy:
    n_gpus_per_node: null
    nnodes: null
    process_on_nodes: null
