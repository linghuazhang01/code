# Five-GPU Top-P overlay for the Math FullTaxonomy next-step selector.
# Topology: 4 actor/rollout GPUs + 1 ref/teacher GPU; global batch size 256.
# Each taxonomy group independently selects the shortest ranked prefix reaching
# 5% of its non-negative selection-score mass at every optimizer step.
extends: top32kl_next_step_full_taxonomy_split_i1_w1_k21_per_type_4gpu_b255.yaml

runtime:
  slurm_allocation_gpus: 5
  wandb_run_id: q1p7b-math-top32kl-ns-taxonomy-topp0p05-i1w1-5gpu-b256

data:
  train_batch_size: 256

actor:
  ppo_mini_batch_size: 256

worker_placement:
  actor_rollout: {n_gpus_per_node: 4, nnodes: 1}
  ref_policy: {n_gpus_per_node: 1, nnodes: 1}

audit:
  output_dir: audit/q1p7b-math-top32kl-ns-taxonomy-topp0p05-i1w1-5gpu-b256
  control_token_online_budget_mode: top_p
  control_token_online_top_p: 0.05
  control_token_online_top_k_per_group: null

paper_eval:
  output_dir: eval_outputs/paper_suite/q1p7b-math-top32kl-ns-taxonomy-topp0p05-i1w1-5gpu-b256

huggingface_checkpoint:
  path_prefix: checkpoints/math/q1p7b-math-top32kl-ns-taxonomy-topp0p05-i1w1-5gpu-b256

trainer:
  experiment_name: q1p7b-math-top32kl-ns-taxonomy-topp0p05-i1w1-5gpu-b256
  n_gpus_per_node: 4
  default_local_dir: checkpoints/MOPD/q1p7b-math-top32kl-ns-taxonomy-topp0p05-i1w1-5gpu-b256
