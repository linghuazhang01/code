# Qwen3-1.7B code / native OPD (chosen-token policy gradient, G-OPD lambda=1) with per-token logging, three colocated GPUs.
# Paired with uniform_top32kl_toklog_3gpu_3c_b255.yaml: only the objective (the four fields of _methods/opd_native.yaml) and run names differ.
# The audit still records teacher Top-32 cross-entropy and entropy (the trainer computes teacher Top-K for logging),
# but configured_token_loss in the response records is the native policy-gradient loss, not the Top-32 RKL.
extends: uniform_top32kl_toklog_3gpu_3c_b255.yaml
runtime:
  wandb_run_id: q1p7b-code-opdnative-toklog-3g3c-b255
  wandb_resume: never
actor:
  distill_loss_builder: policy_gradient
  distill_mode: chosen_token_policy_gradient
  topk_distill_enabled: false
audit:
  loss_variance_signal: policy_gradient_distillation_signal
  output_dir: audit/q1p7b-code-opdnative-toklog-3g3c-b255
paper_eval:
  output_dir: eval_outputs/paper_suite/q1p7b-code-opdnative-toklog-3g3c-b255
huggingface_checkpoint:
  path_prefix: checkpoints/code/q1p7b-code-opdnative-toklog-3g3c-b255
trainer:
  experiment_name: q1p7b-code-opdnative-toklog-3g3c-b255
  default_local_dir: checkpoints/MOPD/q1p7b-code-opdnative-toklog-3g3c-b255
