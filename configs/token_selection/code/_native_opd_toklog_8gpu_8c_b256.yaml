# Qwen3-1.7B code-only native OPD ("OPD naive") with per-token logging, equal weight, 8 colocated GPUs (actor, vLLM rollout and FSDP-8
# teacher share every GPU), global batch 256. Not launchable by itself: the entropy-selection files native_opd_ent_{top20,tail80}_toklog_8gpu_8c_b256.yaml
# extend it. Base: native_opd_toklog_3gpu_3c_b255.yaml (the equal-weight naive run q1p7b-code-opdnative-toklog-3g3c-b255); this file
# changes only the topology (3 -> 8 colocated GPUs, batch 255 -> 256 by the 8-GPU batch rule).
extends: native_opd_toklog_3gpu_3c_b255.yaml
runtime:
  slurm_allocation_gpus: 8
data:
  train_batch_size: 256
actor:
  ppo_mini_batch_size: 256
worker_placement:
  separate_ref_policy: false
  actor_rollout:
    n_gpus_per_node: 8
    nnodes: 1
trainer:
  n_gpus_per_node: 8
ray_kwargs:
  ray_init:
    num_cpus: 48
# Lists replace the parent's list, so the reference FSDP size is restated here.
extra_overrides:
- custom_reward_function.path=mopd_verl/mixed_reward.py
- custom_reward_function.name=compute_score_batched
- reward_model.reward_manager=batch
- trainer.resume_mode=disable
- actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]
- actor_rollout_ref.ref.fsdp_config.fsdp_size=8
