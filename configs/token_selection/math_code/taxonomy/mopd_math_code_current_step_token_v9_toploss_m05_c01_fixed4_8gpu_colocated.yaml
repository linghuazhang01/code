# Token V9 current-step, Math top_p=0.05, Code top_p=0.01, 8-GPU colocated.
# Math = 117 / Code = 169 unified Control IDs; no Structure pool.
extends: _mopd_math_code_current_step_token_v9_fixed4_8gpu_colocated.yaml

runtime:
  wandb_run_id: q1p7b8g-mc-v9-ctl-current-m05c01-f4-b512-s60
  wandb_resume: never

audit:
  control_token_online_top_p: 0.05
  control_token_online_top_p_by_domain:
    math: 0.05
    code: 0.01
  output_dir: audit/q1p7b8g-mc-v9-ctl-current-m05c01-f4-b512-s60

paper_eval:
  output_dir: eval_outputs/paper_suite/q1p7b8g-mc-v9-ctl-current-m05c01-f4-b512-s60

huggingface_checkpoint:
  private: false
  path_prefix: checkpoints/mopd/q1p7b8g-mc-v9-ctl-current-m05c01-f4-b512-s60

trainer:
  experiment_name: q1p7b8g-mc-v9-ctl-current-m05c01-f4-b512-s60
  default_local_dir: checkpoints/MOPD/q1p7b8g-mc-v9-ctl-current-m05c01-f4-b512-s60
# 2026-10-15 speed/robustness update: fused teacher statistics, compact Top-K ids,
# batched reward grader (spawn pool, 120 s hard timeout; timed-out samples score 0).
extra_overrides:
- custom_reward_function.path=mopd_verl/mixed_reward.py
- custom_reward_function.name=compute_score_batched
- reward_model.reward_manager=batch
- trainer.resume_mode=disable
- actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]
- actor_rollout_ref.ref.fsdp_config.fsdp_size=8
teacher_performance:
  fused_statistics: true
  compact_topk_ids: true
