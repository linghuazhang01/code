# 2026-10-15 author request: 8-GPU colocated (actor, vLLM rollout and FSDP-8 teacher share all 8 GPUs); teacher batching, fused statistics, compact ids and batched reward on.
# S9-ID (control arm): SAPD with Current-Step selection at the token-ID level.
# Same pools (inherited unchanged from the paper config), budget, >20 gate, gamma=4 and mean-one scope
# as S9 and the paper config, but every occurrence of each selected ID is up-weighted (ID-mean loss
# ranking, whole-ID budget overshoot as in the paper). Compared with the paper config it isolates
# Current- vs Next-Step timing; compared with S9 it isolates position vs ID units.
# Only selection timing/unit and run names differ from the paper config.
# Eight GPUs: 6 actor/rollout + 2 dedicated teacher.
extends: mopd_math_code_toploss_m05_c01_math_control_code_progvocab_fixed4_8gpu_6s2t.yaml

runtime:
  wandb_run_id: q1p7b4g-mc-tl-m05c01-mctrl-cprog-current-id-8g8c-b528-s60
  wandb_resume: never

  slurm_allocation_gpus: 8
audit:
  control_token_online_selection_timing: current_step
  control_token_online_selection_unit: token_id
  output_dir: audit/q1p7b4g-mc-tl-m05c01-mctrl-cprog-current-id-8g8c-b528-s60

paper_eval:
  output_dir: eval_outputs/paper_suite/q1p7b4g-mc-tl-m05c01-mctrl-cprog-current-id-8g8c-b528-s60

huggingface_checkpoint:
  path_prefix: checkpoints/mopd/q1p7b4g-mc-tl-m05c01-mctrl-cprog-current-id-8g8c-b528-s60

trainer:
  experiment_name: q1p7b4g-mc-tl-m05c01-mctrl-cprog-current-id-8g8c-b528-s60
  default_local_dir: checkpoints/MOPD/q1p7b4g-mc-tl-m05c01-mctrl-cprog-current-id-8g8c-b528-s60
# 2026-10-15 speed/robustness update: fused teacher statistics, compact Top-K ids,
# batched reward grader (spawn pool, 120 s hard timeout; timed-out samples score 0).
  n_gpus_per_node: 8
extra_overrides:
- custom_reward_function.path=mopd_verl/mixed_reward.py
- custom_reward_function.name=compute_score_batched
- reward_model.reward_manager=batch
- trainer.resume_mode=disable
- actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]
- actor_rollout_ref.ref.fsdp_config.fsdp_size=8
teacher_performance:
  fused_statistics: true
  compact_topk_ids: true
  enabled: true
rollout:
  gpu_memory_utilization: 0.75
worker_placement:
  separate_ref_policy: false
  actor_rollout:
    n_gpus_per_node: 8
    nnodes: 1
  ref_policy:
    n_gpus_per_node: null
    nnodes: null
    process_on_nodes: null
