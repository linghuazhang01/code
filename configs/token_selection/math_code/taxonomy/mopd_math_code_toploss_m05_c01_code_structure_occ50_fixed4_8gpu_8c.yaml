# 2026-10-15 author request: 8-GPU colocated (actor, vLLM rollout and FSDP-8 teacher share all 8 GPUs); teacher batching, fused statistics, compact ids and batched reward on.
# Best Math+Code profile (Math 5% / Code 1%, Code Structure-only, Next-Step TopLoss, Fixed4)
# with the strict occurrence gate raised from 20 to 50: a candidate token is eligible for a
# step only if it occurred MORE than 50 times in that domain's batch on every step of the
# window (window 1), instead of more than 20. Pools (Math 390 / Code 551), budgets, weight,
# batch, steps and the 6 actor + 2 teacher topology are identical to the best run
# q1p7b4g-mc-tl-m05c01-cstruct-8g6s2t-b512-s60. Compare against that run.
# Runtime-only deviation: vLLM gpu_memory_utilization 0.6 (best run used 0.75).
extends: mopd_math_code_toploss_m05_c01_code_structure_fixed4_8gpu_8c.yaml

runtime:
  wandb_run_id: q1p7b8g-mc-tl-m05c01-cstruct-occ50-f4-8c-b512-s60
  wandb_resume: never

  slurm_allocation_gpus: 8
rollout:
  gpu_memory_utilization: 0.6

audit:
  control_token_online_min_mean_occurrences_per_step: 50.0
  output_dir: audit/q1p7b8g-mc-tl-m05c01-cstruct-occ50-f4-8c-b512-s60

paper_eval:
  output_dir: eval_outputs/paper_suite/q1p7b8g-mc-tl-m05c01-cstruct-occ50-f4-8c-b512-s60

huggingface_checkpoint:
  path_prefix: checkpoints/mopd/q1p7b8g-mc-tl-m05c01-cstruct-occ50-f4-8c-b512-s60

trainer:
  experiment_name: q1p7b8g-mc-tl-m05c01-cstruct-occ50-f4-8c-b512-s60
  default_local_dir: checkpoints/MOPD/q1p7b8g-mc-tl-m05c01-cstruct-occ50-f4-8c-b512-s60
# 2026-10-15 speed/robustness update: fused teacher statistics, compact Top-K ids,
# batched reward grader (spawn pool, 120 s hard timeout; timed-out samples score 0).
  n_gpus_per_node: 8
extra_overrides:
- custom_reward_function.path=mopd_verl/mixed_reward.py
- custom_reward_function.name=compute_score_batched
- reward_model.reward_manager=batch
- trainer.resume_mode=disable
- actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]
- actor_rollout_ref.ref.fsdp_config.fsdp_size=8
teacher_performance:
  fused_statistics: true
  compact_topk_ids: true
  enabled: true
worker_placement:
  separate_ref_policy: false
  actor_rollout:
    n_gpus_per_node: 8
    nnodes: 1
  ref_policy:
    n_gpus_per_node: null
    nnodes: null
    process_on_nodes: null
