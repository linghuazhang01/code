# Two-domain Math+Code MOPD training profile.
# Method: TopLoss online selector + Fixed4 selected-token weighting with per-domain mean-one normalization.
# Four colocated GPUs, batch 528, seed 42, 60 training steps, vLLM utilization 0.75.
# Both domains use the full Control+Structure candidate union.

runtime:
  python_bin: python3
  verl_module: verl.trainer.main_ppo
  wandb_mode: online
  wandb_entity: lz101-rice-university
  wandb_run_id: q1p7b4g-mc-tl-f4-b528-s60
  wandb_resume: never
  env_file: .env.local
  used_model: no_api
  slurm_allocation_gpus: 4

data:
  domain_train_files:
    math:
    - ../mopd/code/data/G-OPD-Training-Data/DeepMath-103K/train_filtered_level6.parquet
    code:
    - ../mopd/code/data/G-OPD-Training-Data/Eurus/code_train.parquet
  domain_sampling_weights:
    math: 1
    code: 1
  domain_sampling_replacement: true
  load_parquet_direct: true
  val_files:
  - ../mopd/code/data/eval_data/math/AIME24/test.parquet
  - ../mopd/code/data/eval_data/math/AIME25/test.parquet
  - ../mopd/code/data/eval_data/math/HMMT25Feb/test.parquet
  - ../mopd/code/data/eval_data/math/HMMT25Nov/test.parquet
  - ../mopd/code/data/eval_data/code/HumanEvalPlus/test.parquet
  - ../mopd/code/data/eval_data/code/MBPPPlus/test.parquet
  train_batch_size: 528
  val_batch_size: 1024
  max_prompt_length: 2048
  max_response_length: 16384
  filter_overlong_prompts: true
  truncation: error
  shuffle: true
  validation_shuffle: false
  seed: 42
  return_raw_chat: true
  enable_thinking: false

model:
  student_path: ../mopd/models/Qwen3-1.7B
  student_base_path: null
  math_teacher_path: ../mopd/models/Qwen3-30B-A3B-Instruct-2507
  code_teacher_path: ../mopd/models/Qwen3-30B-A3B-Instruct-2507
  domain_teacher_paths:
    math: ../mopd/models/Qwen3-30B-A3B-Instruct-2507
    code: ../mopd/models/Qwen3-30B-A3B-Instruct-2507
  teacher_model_device: gpu
  attn_implementation: flash_attention_2

actor:
  learning_rate: 5e-6
  lr_warmup_steps_ratio: 0.0
  only_reverse_kl_advantages: false
  lambda_vals: 1.0
  multi_teacher_distill: true
  distill_loss_builder: topk_kl
  distill_mode: topk_renormalized_reverse_kl
  topk_distill_enabled: true
  topk_distill_kl_direction: reverse
  topk_distill_k: 32
  topk_distill_support_source: teacher
  topk_distill_tail_bucket: false
  topk_distill_temperature: 1.0
  topk_distill_loss_weight: 1.0
  topk_distill_logprob_chunk_size: 16
  topk_distill_logprob_mode: sparse
  ppo_mini_batch_size: 528
  ppo_micro_batch_size_per_gpu: 1
  ppo_epochs: 1
  use_dynamic_bsz: false
  use_kl_loss: true
  kl_loss_coef: 0
  kl_loss_type: low_var_kl
  entropy_coeff: 0
  ppo_max_token_len_per_gpu: 32768
  gradient_checkpointing: true
  param_offload: true
  optimizer_offload: true
  fsdp_size: 1

rollout:
  calculate_log_probs: true
  log_prob_micro_batch_size_per_gpu: 1
  tensor_model_parallel_size: 1
  name: vllm
  mode: sync
  gpu_memory_utilization: 0.75
  enforce_eager: false
  enable_chunked_prefill: false
  n: 1
  max_num_batched_tokens: 32768
  max_model_len: 18432
  max_num_seqs: 64
  do_sample: true
  temperature: 1.0
  top_p: 1.0
  val_n: 1
  val_do_sample: false
  val_temperature: 0.0
  val_top_p: 1.0
  seed: 42

worker_placement:
  separate_ref_policy: false
  actor_rollout:
    n_gpus_per_node: 4
    nnodes: 1
  ref_policy:
    n_gpus_per_node: null
    nnodes: null
    process_on_nodes: null

extra_overrides:
- custom_reward_function.path=mopd_verl/mixed_reward.py
- custom_reward_function.name=compute_score
- trainer.resume_mode=disable
- actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]

