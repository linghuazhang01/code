# V6 Current-Step Math 5% / Code 1%, student3 + dedicated teacher1 on four physical GPUs.
# Student: 3 ranks (intended physical 0/1/2, NVLink). Teacher: 1 dedicated rank (intended
# physical 4) holding the full BF16 30B replica; world size 1 enables teacher batching and
# stable_sort MoE dispatch. Ray assigns pool GPUs, so verify the physical mapping at launch.
# Use start.sh --local; the GPU IDs are physical IDs for the current server.
extends: mopd_math_code_current_step_token_v6_toploss_m05_c01_fixed4_4gpu_colocated.yaml

runtime:
  cuda_visible_devices: "0,1,2,4"
  slurm_allocation_gpus: 4
  wandb_run_id: q1p7b3s1t-mc-v6-cs-current-m05c01-f4-b528-s60
  wandb_resume: never

worker_placement:
  separate_ref_policy: true
  actor_rollout:
    n_gpus_per_node: 3
    nnodes: 1
    process_on_nodes: null
  ref_policy:
    n_gpus_per_node: 1
    nnodes: 1
    process_on_nodes: null

# Lists replace the parent's list; retain all existing non-topology overrides.
extra_overrides:
- custom_reward_function.path=mopd_verl/mixed_reward.py
- custom_reward_function.name=compute_score
- trainer.resume_mode=disable
- actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]
- actor_rollout_ref.ref.fsdp_config.fsdp_size=1

audit:
  output_dir: audit/q1p7b3s1t-mc-v6-cs-current-m05c01-f4-b528-s60

paper_eval:
  output_dir: eval_outputs/paper_suite/q1p7b3s1t-mc-v6-cs-current-m05c01-f4-b528-s60

huggingface_checkpoint:
  path_prefix: checkpoints/mopd/q1p7b3s1t-mc-v6-cs-current-m05c01-f4-b528-s60

trainer:
  n_gpus_per_node: 3
  nnodes: 1
  experiment_name: q1p7b3s1t-mc-v6-cs-current-m05c01-f4-b528-s60
  default_local_dir: checkpoints/MOPD/q1p7b3s1t-mc-v6-cs-current-m05c01-f4-b528-s60
