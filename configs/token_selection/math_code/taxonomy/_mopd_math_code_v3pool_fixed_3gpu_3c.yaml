# v3 pools, Math+Code, three colocated GPUs; everything else as _mopd_math_code_v3pool_fixed_4gpu.yaml (batch 528 = 3 x 176).
extends: _mopd_math_code_v3pool_fixed_4gpu.yaml
runtime:
  slurm_allocation_gpus: 3
rollout:
  gpu_memory_utilization: 0.4
worker_placement:
  separate_ref_policy: false
  actor_rollout:
    n_gpus_per_node: 3
    nnodes: 1
  ref_policy:
    n_gpus_per_node: null
    nnodes: null
    process_on_nodes: null
teacher_performance:
  fused_statistics: true
  compact_topk_ids: true
trainer:
  n_gpus_per_node: 3
extra_overrides:
- custom_reward_function.path=mopd_verl/mixed_reward.py
- custom_reward_function.name=compute_score
- trainer.resume_mode=disable
- actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]
- actor_rollout_ref.ref.fsdp_config.fsdp_size=3
