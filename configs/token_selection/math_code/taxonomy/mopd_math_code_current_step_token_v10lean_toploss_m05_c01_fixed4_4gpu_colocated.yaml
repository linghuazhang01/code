# Token V10-lean current-step, Math top_p=0.05, Code top_p=0.01, 4-GPU colocated.
# Math = 390 (the best Math+Code run's Math pool) / Code = 379 (V10-lean). Of the two pools only Code
# differs from the best run, but selection timing differs too (current_step here, next_step in the best
# run); compare against the same recipe with the current Code 551/704 pool and
# with a no-prior (full-vocabulary / matched-random) control.
# vLLM gpu_memory_utilization is lowered from the profile's 0.75 to 0.6 (2026-10-07, user decision) so the
# run can share GPU 0 with another ~18 GB process on the CityU server; generation throughput drops a little.
extends: _mopd_math_code_current_step_token_v10lean_fixed4_4gpu_colocated.yaml

rollout:
  gpu_memory_utilization: 0.6

# 2026-10-07: the batched teacher path now also runs on colocated multi-rank teachers (boundaries
# synchronized on the worker process group); fused statistics compute log-prob, entropy and the
# Top-K support in one response-only pass and compact int32 support IDs cut host/device traffic.
teacher_performance:
  enabled: true
  fused_statistics: true
  compact_topk_ids: true

runtime:
  wandb_run_id: q1p7b4g-mc-v10lean-m390c379-current-m05c01-f4-b528-s60
  wandb_resume: never

audit:
  control_token_online_top_p: 0.05
  control_token_online_top_p_by_domain:
    math: 0.05
    code: 0.01
  output_dir: audit/q1p7b4g-mc-v10lean-m390c379-current-m05c01-f4-b528-s60

paper_eval:
  output_dir: eval_outputs/paper_suite/q1p7b4g-mc-v10lean-m390c379-current-m05c01-f4-b528-s60

huggingface_checkpoint:
  private: false
  path_prefix: checkpoints/mopd/q1p7b4g-mc-v10lean-m390c379-current-m05c01-f4-b528-s60

trainer:
  experiment_name: q1p7b4g-mc-v10lean-m390c379-current-m05c01-f4-b528-s60
  default_local_dir: checkpoints/MOPD/q1p7b4g-mc-v10lean-m390c379-current-m05c01-f4-b528-s60
