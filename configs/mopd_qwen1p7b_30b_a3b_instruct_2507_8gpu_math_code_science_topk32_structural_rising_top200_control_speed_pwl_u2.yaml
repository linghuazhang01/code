  control_token_phase_gate_enabled: false
  control_token_span_weighting_enabled: false

  # Per domain and per optimizer step:
  #   G_d(t) = mean_structural |log p_teacher - log p_student|
  #   E_d(t) = 0.80 * E_d(t-1) + 0.20 * G_d(t)
  #   speed_d(t) = [E_d(t-5) - E_d(t)] / 5
  # The current step uses the stored previous weight. A triggered update below
  # becomes control_weight_next and is applied from the next optimizer step.
  control_token_speed_weighting_enabled: true
  control_token_speed_window_steps: 5
