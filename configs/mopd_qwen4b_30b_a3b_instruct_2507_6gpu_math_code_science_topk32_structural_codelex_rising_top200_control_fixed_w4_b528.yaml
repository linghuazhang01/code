# Six-GPU math+code+science Top-32 training profile for Qwen3-4B student
# distillation from Qwen3-30B-A3B-Instruct-2507.
#
# Logical training topology:
# - actor/rollout pool: 4 GPUs for Qwen3-4B student + vLLM
# - ref/teacher pool: 2 GPUs for Qwen3-30B-A3B-Instruct-2507
#
# Request exactly six Slurm GPUs. Preserve Slurm's allocated device list so
# CUDA exposes those devices with process-local logical indices 0-5:
# actor/rollout logical GPUs 0,1,2,3 followed by ref/teacher logical GPUs 4,5.
#
# Keep trainer.n_gpus_per_node equal to the actor/rollout pool size, because
# verl uses trainer.* as the actor DP world size.
#
# Audits keep token-gap/entropy vocab vectors and complete response records.
# The only active reweight mechanism is per-domain fixed 4.0x Structural+CodeLex-token weighting;
# full/sample/token gradients and other reweight families stay disabled.
#
# Analysis-derived Structural+CodeLex selector for a fixed-weight follow-up intervention:
# - discovery run: 4B-OPD baseline; Rising endpoints: step 6 -> step 20
# - artifact: top200-token-details.csv
# - artifact SHA256: 9f104cd452c5689b66bb59800070495e273958668612ba36565f4dc0ba0aca8f
# - rank: endpoint absolute chosen-token log-p gap reduction, with >=20
#   occurrences at both endpoints; keep Rising Top-200 per domain
# - structural filter: PDTB connective candidate union Format/boundary
# - Code-domain extension: exact, case-sensitive Python keyword/builtin/
#   language/module/method/API/programming-lexicon matches in Code Rising
#   Top-200; activation depends on domain, not Math/Science rank exclusion
# - newly added Code lexical IDs beyond the structural selector: 14
# - expected unique ID counts after union: Math=39, Code=50, Science=33
# - Stable-only IDs are excluded; this is a discovery-run-based follow-up
#   selector, not the outcome-independent common-support main-method selector.

runtime:
  python_bin: /home/shuang_qiu/env/miniconda3/envs/mopd-verl/bin/python
  verl_module: verl.trainer.main_ppo
  wandb_mode: online
  wandb_entity: lz101-rice-university
  # Use a distinct W&B run ID for this GPU topology.
  wandb_run_id: q4b-6g-mcs-struct-codelex-r200-fixed-w4-b528-v1
  wandb_resume: allow
  env_file: ../mopd/code/.env.local
  used_model: no_api
  # Let Slurm select the six physical devices; do not override its allocation.
  slurm_allocation_gpus: 6
  cuda_visible_devices: null

data:
  domain_train_files:
    math:
      - ../mopd/code/data/G-OPD-Training-Data/DeepMath-103K/train_filtered_level6.parquet
    code:
      - ../mopd/code/data/G-OPD-Training-Data/Eurus/code_train.parquet
    science:
      - ../mopd/code/data/G-OPD-Training-Data/Science/train.parquet
  domain_sampling_weights:
    math: 1
    code: 1
    science: 1
  domain_sampling_replacement: true
  load_parquet_direct: true
  val_files:
    - ../mopd/code/data/eval_data/math/AIME24/test.parquet
    - ../mopd/code/data/eval_data/math/AIME25/test.parquet
    - ../mopd/code/data/eval_data/math/HMMT25Feb/test.parquet
    - ../mopd/code/data/eval_data/math/HMMT25Nov/test.parquet
    - ../mopd/code/data/eval_data/code/HumanEvalPlus/test.parquet
    - ../mopd/code/data/eval_data/code/MBPPPlus/test.parquet
    # Prepare with scripts/prepare_m2rl_eval_data.sh.
    - ../mopd/code/data/eval_data/science/GPQA/test.parquet
    # - ../mopd/code/data/eval_data/code/LiveCodeBench/test.parquet
  # 528 = 4 actor GPUs x 132 samples = 3 domains x 176 samples.
  train_batch_size: 528
  max_prompt_length: 2048
  max_response_length: 16384
  val_batch_size: 1024
  filter_overlong_prompts: true
  truncation: error
  shuffle: true
  validation_shuffle: false
  seed: 42
  return_raw_chat: true
  enable_thinking: false

model:
  student_path: ../mopd/models/Qwen3-4B
  student_base_path: null
  math_teacher_path: ../mopd/models/Qwen3-30B-A3B-Instruct-2507
  code_teacher_path: ../mopd/models/Qwen3-30B-A3B-Instruct-2507
  domain_teacher_paths:
    math: ../mopd/models/Qwen3-30B-A3B-Instruct-2507
    code: ../mopd/models/Qwen3-30B-A3B-Instruct-2507
    science: ../mopd/models/Qwen3-30B-A3B-Instruct-2507
  teacher_model_device: gpu
  attn_implementation: flash_attention_2

actor:
  learning_rate: "5e-6"
  lr_warmup_steps_ratio: 0.0
  only_reverse_kl_advantages: false
  lambda_vals: 1.0
  multi_teacher_distill: true
  distill_loss_builder: topk_kl
  distill_mode: topk_renormalized_reverse_kl
  topk_distill_enabled: true
  topk_distill_kl_direction: reverse
  topk_distill_k: 32
  topk_distill_support_source: teacher
  topk_distill_tail_bucket: false
  topk_distill_temperature: 1.0
  topk_distill_loss_weight: 1.0
  topk_distill_logprob_chunk_size: 16
  topk_distill_logprob_mode: sparse
  ppo_mini_batch_size: 528
  ppo_micro_batch_size_per_gpu: 1
  use_kl_loss: true
  kl_loss_coef: 0
  kl_loss_type: low_var_kl
  entropy_coeff: 0
  ppo_max_token_len_per_gpu: 32768
  gradient_checkpointing: true
  param_offload: true
  optimizer_offload: true
  fsdp_size: 1
  use_dynamic_bsz: false

rollout:
  calculate_log_probs: true
  log_prob_micro_batch_size_per_gpu: 1
  tensor_model_parallel_size: 2
  name: vllm
  mode: sync
  gpu_memory_utilization: 0.6
  enforce_eager: true
  enable_chunked_prefill: false
  n: 1
  max_num_batched_tokens: 32768
  max_model_len: 18432
  max_num_seqs: 24
  do_sample: true
  temperature: 1.0
  top_p: 1.0
  val_n: 1
  val_do_sample: false
  val_temperature: 0.0
  val_top_p: 1.0
  seed: 42

rollout_correction:
  rollout_is: token
  rollout_is_threshold: 5.0
  rollout_rs: null
  bypass_mode: false

extra_overrides:
  - custom_reward_function.path=mopd_verl/mixed_reward.py
  - custom_reward_function.name=compute_score
  - trainer.resume_mode=auto

worker_placement:
  separate_ref_policy: true
  actor_rollout:
    n_gpus_per_node: 4
    nnodes: 1
  ref_policy:
    n_gpus_per_node: 2
    nnodes: 1

audit:
  enabled: true
  output_dir: audit/qwen4b_30b_a3b_instruct_2507_6gpu_math_code_science_topk32_structural_codelex_rising_top200_control_fixed_w4_b528_v1
  domains:
