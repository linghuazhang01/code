  tensorboard_layout: domain_category
  tensorboard_prune_mode: core
  loss_variance_signal: topk_renormalized_reverse_kl
  max_samples_per_domain: null
  high_variance_cv_threshold: 1.0
  log_sample_level: false
  log_sample_level_freq_steps: 1
  # Save every valid response and its aligned per-token audit signals under
  # audit/<experiment>/step_XXXXXX/jsonls/response_records_<domain>.jsonl.gz.
