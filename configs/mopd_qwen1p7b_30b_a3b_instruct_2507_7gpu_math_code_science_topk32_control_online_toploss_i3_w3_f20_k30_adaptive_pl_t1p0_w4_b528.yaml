# Same-batch loss-relative signed neighborhoods around the lagged online
# Top-30 Control IDs for a seven-GPU topology (6 actor + 1 ref GPU).
# The selector audits every 3 steps over a 3-step window and applies its
# selection from the next step. A neighbor within D in [-8, 8] is weighted
# when its individual relative-loss score is at least 1.0; D0 remains forced
# to kernel weight 1.
