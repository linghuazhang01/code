# Eight-GPU math+code+IF+science Top-32 training profile for distilling
# NVIDIA Nemotron-Research-GooseReason-4B-Instruct into Qwen3-1.7B-Base.
# The historical filename is retained for launcher compatibility; runtime
# output names below identify the four-domain, no-token-gradient policy.
#
# Physical GPU layout:
# - one colocated 8-GPU pool for the Base student actor/rollout and the
#   GooseReason-4B-Instruct ref/teacher;
# - actor FSDP size 1 remains replicated, while the ref/teacher uses verl's
#   default full-shard group across the shared worker world;
# - rollout TP=2 creates four rollout replicas across the eight GPUs.
#
# Compatibility gate:
# - both checkpoints use the Qwen3 151,936-entry model vocabulary and the same
#   token-ID mapping required by token-ID Top-32 distillation;
# - Qwen3-1.7B-Base terminates on EOS 151643, while GooseReason's model EOS is
#   151645 and its generation config accepts [151645, 151643];
# - keep return_raw_chat=true so the ref worker can re-tokenize prompts with the
#   teacher template. The local Base checkpoint must also provide the expected
#   prompt-format path.
# Run a one-step smoke test and inspect prompt formatting, EOS termination, and
# peak memory before the 200-step run. Full-gradient replay runs every step;
# token-gradient replay and dynamic domain loss reweighting are disabled.
#
# Audit policy:
# - all implemented observation families are enabled (sample/validation logs,
#   full gradients, token/logp/entropy vocab vectors, and Top-32 cross entropy;
# - sample-gradient replay and all descendants are disabled because the clean
#   domain-gradient rebuild explicitly rejects that retired mode;
# - token-gradient replay and its selectors are disabled for this run;
# - all occurrence-mean vocab vectors and every loss-weighting objective are
#   disabled; domain sampling remains balanced.

runtime:
  python_bin: python
  verl_module: verl.trainer.main_ppo
  wandb_mode: online
  wandb_entity: null
  env_file: .env.local
  used_model: no_api

data:
  domain_train_files:
    math:
      - data/G-OPD-Training-Data/DeepMath-103K/train_filtered_level6.parquet
    code:
      - data/G-OPD-Training-Data/Eurus/code_train.parquet
    if:
      - data/G-OPD-Training-Data/IF/train.parquet
    science:
      - data/G-OPD-Training-Data/Science/train.parquet
  domain_sampling_weights:
    math: 1
    code: 1
    if: 1
    science: 1
  domain_sampling_replacement: true
  load_parquet_direct: true
  val_files:
    - data/eval_data/math/AIME24/test.parquet
    - data/eval_data/math/AIME25/test.parquet
    - data/eval_data/math/HMMT25Feb/test.parquet
    - data/eval_data/math/HMMT25Nov/test.parquet
    - data/eval_data/code/HumanEvalPlus/test.parquet
    - data/eval_data/code/MBPPPlus/test.parquet
    # Prepare with scripts/prepare_m2rl_eval_data.sh.
    - data/eval_data/if/IFBench/test.parquet
    - data/eval_data/science/GPQA/test.parquet
    # - data/eval_data/code/LiveCodeBench/test.parquet
  # 1024 = 8 actor GPUs x 4 domains x 32 samples.
  train_batch_size: 1024
  max_prompt_length: 2048
  max_response_length: 16384
  val_batch_size: 1024
  filter_overlong_prompts: true
  truncation: error
  shuffle: true
  validation_shuffle: false
  seed: 42
  return_raw_chat: true
  enable_thinking: false

model:
  student_path: ../models/Qwen3-1.7B-Base
  student_base_path: null
  math_teacher_path: ../models/Nemotron-Research-GooseReason-4B-Instruct
  code_teacher_path: ../models/Nemotron-Research-GooseReason-4B-Instruct
  if_teacher_path: ../models/Nemotron-Research-GooseReason-4B-Instruct
  domain_teacher_paths:
    math: ../models/Nemotron-Research-GooseReason-4B-Instruct
    code: ../models/Nemotron-Research-GooseReason-4B-Instruct
    if: ../models/Nemotron-Research-GooseReason-4B-Instruct
    science: ../models/Nemotron-Research-GooseReason-4B-Instruct
  teacher_model_device: gpu
  attn_implementation: flash_attention_2

actor:
  learning_rate: "5e-6"
  lr_warmup_steps_ratio: 0.0
  only_reverse_kl_advantages: false
  lambda_vals: 1.0
  multi_teacher_distill: true
  distill_loss_builder: topk_kl
  distill_mode: topk_renormalized_reverse_kl
  topk_distill_enabled: true
  topk_distill_kl_direction: reverse
  topk_distill_k: 32
  topk_distill_support_source: teacher
  topk_distill_tail_bucket: false
  topk_distill_temperature: 1.0
  topk_distill_loss_weight: 1.0
  topk_distill_logprob_chunk_size: 16
  topk_distill_logprob_mode: sparse
  ppo_mini_batch_size: 1024
  ppo_micro_batch_size_per_gpu: 1
  use_kl_loss: true
  kl_loss_coef: 0
  kl_loss_type: low_var_kl
  entropy_coeff: 0
  ppo_max_token_len_per_gpu: 32768
  gradient_checkpointing: true
  param_offload: true
  optimizer_offload: true
  fsdp_size: 1
  use_dynamic_bsz: false

rollout:
  calculate_log_probs: true
  log_prob_micro_batch_size_per_gpu: 1
  tensor_model_parallel_size: 2
  name: vllm
  mode: sync
  gpu_memory_utilization: 0.6
  enforce_eager: true
  enable_chunked_prefill: false
  n: 1
  max_num_batched_tokens: 32768
  max_model_len: 18432
  max_num_seqs: 24
  do_sample: true
  temperature: 1.0
  top_p: 1.0
  val_n: 1
  val_do_sample: false
  val_temperature: 0.0
  val_top_p: 1.0
  seed: 42

rollout_correction:
  rollout_is: token
  rollout_is_threshold: 5.0
  rollout_rs: null
  bypass_mode: false

extra_overrides:
  - custom_reward_function.path=mopd_verl/mixed_reward.py
  - custom_reward_function.name=compute_score
  - trainer.resume_mode=auto

worker_placement:
  # Fuse actor/rollout and ref/teacher roles into the same eight Ray workers.
  separate_ref_policy: false
  actor_rollout:
    n_gpus_per_node: 8
    nnodes: 1

audit:
  enabled: true
  output_dir: audit/qwen1p7b_base_goosereason4b_instruct_8gpu_math_code_if_science_topk32_noreweight_fullgrad_nosamplegrad_notokengrad
  domains:
    - math
    - code
    - if
    - science
  tensorboard_prefix: mopd
  tensorboard_layout: domain_category
  tensorboard_prune_mode: none
  loss_variance_signal: opd_loss_token
  max_samples_per_domain: null
  high_variance_cv_threshold: 1.0
  log_sample_level: true
  log_sample_level_freq_steps: 1
  log_validation_metrics: true
  log_validation_metrics_freq_steps: 1
  tier2_window_size: 20
  calibration_bins: 10
  full_gradient_enabled: true
  full_gradient_freq_steps: 1
  full_grad_training_parity_freq_steps: 1
  full_grad_training_parity_rel_l2_threshold: 2.0e-2
  full_gradient_train_max_samples_per_domain: null
  full_gradient_micro_batch_size_per_gpu: 1
  full_gradient_storage_dtype: bfloat16
  execution_timing: pre_update
  # The clean sidecar uses sequence-masked replay as the trusted path.
  full_gradient_direct_recompute_enabled: false
  sequence_masked_target_enabled: true
  sequence_masked_target_use_as_primary: true
  sequence_replay_skip_non_target_domains: false
  sequence_masked_target_closure_rel_l2_threshold: 0.02
  full_gradient_offload_domain_gradients: true
  # Retired sample-gradient family: keep the root and every descendant off.
  sample_gradient_enabled: false
  sample_gradient_freq_steps: 1
  sample_gradient_norm_enabled: false
  sample_gradient_cos_enabled: false
  sample_gradient_cos_freq_steps: 1
  sample_gradient_backward_recompute_enabled: false
  sample_gradient_backward_sync_enabled: false
  sample_gradient_log_sample_level: false
  sample_gradient_log_sample_level_freq_steps: 1
  token_gap_enabled: true
  token_gap_freq_steps: 1
  token_gap_vocab_vector_enabled: true
  token_gap_vocab_vector_freq_steps: 1
  token_gap_vocab_size: null
  vocab_per_occurrence_mean_vector_enabled: false
  logp_vocab_per_occurrence_mean_vector_enabled: false
  logp_abs_vocab_per_occurrence_mean_vector_enabled: false
  entropy_vocab_per_occurrence_mean_vector_enabled: false
  entropy_enabled: true
  entropy_freq_steps: 1
  entropy_vocab_vector_enabled: true
  entropy_vocab_vector_freq_steps: 1
  topk_teacher_student_cross_entropy_vocab_enabled: true
  topk_teacher_student_cross_entropy_vocab_freq_steps: 1
  topk_teacher_student_cross_entropy_k: 32
  # Match the renormalized teacher Top-32 training support exactly.
  topk_teacher_student_cross_entropy_include_tail: false
  topk_teacher_student_cross_entropy_temperature: 1.0
  logp_vector_enabled: true
  logp_vector_freq_steps: 1
  logp_abs_vector_enabled: true
  logp_abs_vector_freq_steps: 1
  # Token-gradient replay is intentionally disabled; loss/token statistics
  # above remain active and do not require backward replay.
  token_gradient_enabled: false
  token_gradient_freq_steps: 4
  token_gradient_tail_enabled: false
  token_gradient_tail_fraction: 0.10
  token_gradient_tail_min_tokens: 1
  # Legacy signed-gap selectors are not consumed by the clean sidecar.
  token_gradient_gap_selection_enabled: false
  token_gradient_gap_abs_selection_enabled: false
  token_gradient_loss_abs_selection_enabled: false
  token_gradient_top_k: null
  token_gradient_top_p_enabled: false
  token_gradient_top_p: 0.05
  token_gradient_log_tokens_jsonl_enabled: false
  token_gradient_strict_grad_restore: false
  # Legacy replay switches are not consumed by the clean sidecar.
  token_gradient_backward_recompute_enabled: false
  token_gradient_backward_sync_enabled: false
  dynamic_domain_loss_weighting_enabled: false
  dynamic_domain_loss_weighting_freq_steps: 4
  dynamic_domain_loss_weighting_signal_source: gradient_norm
  dynamic_domain_loss_weighting_ema_beta: 0.70
  dynamic_domain_loss_weighting_weight_ema_beta: 0.50
  dynamic_domain_loss_weighting_alpha: 0.75
  dynamic_domain_loss_weighting_min: 0.3333333333333333
  dynamic_domain_loss_weighting_max: 3.0
  # These two knobs alter the training objective and are separate ablations.
  control_token_loss_weighting_enabled: false
  control_token_loss_weight: 1.0
  control_token_ids: []
  all_domain_shared_token_loss_weighting_enabled: false
  all_domain_shared_token_loss_weight: 1.0
  all_domain_shared_token_selection_mode: per_step_mean_abs_loss
  all_domain_shared_token_top_k: 100
  # Parsed legacy knob with no active launcher/sidecar implementation.
  gradient_fingerprint_enabled: false
  gradient_fingerprint_freq_steps: 1

paper_eval:
  enabled: false
  script_path: eval/scripts/run_paper_eval_suite.sh
  model_path: null
  output_dir: eval_outputs/paper_suite/qwen1p7b_base_goosereason4b_instruct_8gpu_math_code_if_science_topk32_noreweight_fullgrad_nosamplegrad_notokengrad
  datasets:
    - aime24
    - aime25
    - hmmt25_feb
    - hmmt25_nov
    - humaneval_plus
    - mbpp_plus
    - lcb
  run_on_initial_validation: true
  evaluate_current_checkpoint: true
  fail_on_error: false
  timeout_seconds: 0

trainer:
  project_name: MOPD
  experiment_name: qwen1p7b-base-from-goosereason4b-instruct-8gpu-math-code-if-science-topk32-noreweight-fullgrad-nosamplegrad-notokengrad
  seed: 42
  logger: '["console","tensorboard","wandb"]'
  n_gpus_per_node: 8
  nnodes: 1
  save_freq: 5
  test_freq: -1
  total_epochs: 3
  total_training_steps: 200
  default_local_dir: checkpoints/MOPD/qwen1p7b-base-from-goosereason4b-instruct-8gpu-math-code-if-science-topk32-noreweight-fullgrad-nosamplegrad-notokengrad
  critic_warmup: 0
  # Execute validation audit once without adding periodic full-suite runs.
  val_before_train: true
  log_val_generations: 10
  max_actor_ckpt_to_keep: 4
  max_critic_ckpt_to_keep: 1

ray_kwargs:
  ray_init:
    include_dashboard: false
    num_cpus: 32
